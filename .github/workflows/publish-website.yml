name: Publish website

# Builds the Riyeser website (website/ on branch module/desk-assistant) and publishes it with GitHub Pages.
# Actions → "Publish website" → Run workflow.  Pages must use "GitHub Actions" as its source (Settings → Pages).
on:
  workflow_dispatch:
    inputs:
      layout:
        description: "combined = Riyeser Services at riyeser.com/ and the website at /software/ (use once riyeser.com points here); website = website only"
        type: choice
        options: [website, combined]
        default: website

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  # Build and upload in one job, deploy in the next: deploying straight after the upload in the same job often
  # failed with "Fetching artifact metadata failed" because GitHub hadn't registered the upload yet.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: module/desk-assistant }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: |
          if [ "${{ inputs.layout }}" = "combined" ]; then node website/build-combined.mjs; else node website/build.mjs; fi
        env:
          SITE_BASE: "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v4
        with: { path: website/public }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - name: Give GitHub a moment to register the upload
        run: sleep 15
      - id: deploy
        uses: actions/deploy-pages@v4
        with: { timeout: 900000 }
