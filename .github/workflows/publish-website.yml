name: Publish website

# Builds the Riyeser website (website/ on branch module/desk-assistant) and publishes it with GitHub Pages.
# Actions → "Publish website" → Run workflow.  Pages must use "GitHub Actions" as its source (Settings → Pages).
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v5
        with: { ref: module/desk-assistant }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: node website/build.mjs
        env:
          SITE_BASE: "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v4
        with: { path: website/public }
      - id: deploy
        uses: actions/deploy-pages@v4
