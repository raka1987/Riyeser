name: Deploy licence signing

# The "licence" Edge Function (supabase/functions/licence): signs each company's Riyeser licence with Ed25519, so no
# program on a PC trusts a licence file someone edited. Runs on demand, and when the function changes on main.
#
# Needs one GitHub secret: SUPABASE_ACCESS_TOKEN (a Supabase personal access token). Without it, this says so and stops.
# The first time, it makes the signing key INSIDE this runner and hands it straight to Supabase as the function secret
# LICENCE_SIGNING_KEY: it only ever goes through a pipe (never a file, a variable, the log or the repo), and it isn't
# made again once that secret exists (a new key would refuse every program built with the old public key).
# Only the PUBLIC key is printed (job summary). Builds fetch it from …/functions/v1/licence/public-key.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-licence-function.yml"]

permissions:
  contents: read

concurrency: { group: deploy-licence-function, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: goaugynxeatzqzifpoes   # public (it's in riyeser.com/link/config.js)
    steps:
      - name: Is it set up?
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Licence signing isn't set up yet: add the GitHub secret SUPABASE_ACCESS_TOKEN, then run this again."
            echo "Licence signing isn't set up yet: add the GitHub secret **SUPABASE_ACCESS_TOKEN**, then run this again." >> "$GITHUB_STEP_SUMMARY"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'yes'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'yes'
        with: { node-version: "22" }
      - uses: denoland/setup-deno@v2
        if: steps.ready.outputs.go == 'yes'
        with: { deno-version: v2.x }
      - name: Test the signing code
        if: steps.ready.outputs.go == 'yes'
        run: deno test --allow-read supabase/functions/licence
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.go == 'yes'
        with: { version: latest }
      - name: Signing key (made once, here, and given straight to Supabase)
        if: steps.ready.outputs.go == 'yes'
        run: |
          set -euo pipefail
          if supabase secrets list --project-ref "$PROJECT_REF" | grep -qw LICENCE_SIGNING_KEY; then
            echo "The signing key is already set up (kept as it is)."
            exit 0
          fi
          # Made in memory and piped in: never in a file, a variable or the log.
          node -e "
            const c = require('crypto');
            const j = c.generateKeyPairSync('ed25519').privateKey.export({ format: 'jwk' });
            const v = Buffer.from(JSON.stringify({ kty: 'OKP', crv: 'Ed25519', d: j.d, x: j.x })).toString('base64url');
            process.stdout.write('LICENCE_SIGNING_KEY=' + v + '\n');
          " | supabase secrets set --yes --env-file /dev/stdin --project-ref "$PROJECT_REF" > /dev/null
          supabase secrets list --project-ref "$PROJECT_REF" | grep -qw LICENCE_SIGNING_KEY || { echo "The signing key didn't save."; exit 1; }
          echo "A new signing key was made and saved as the function secret LICENCE_SIGNING_KEY."
      - name: Deploy the licence function
        if: steps.ready.outputs.go == 'yes'
        # --no-verify-jwt: the public key is fetched without signing in; signing a licence checks the person's session itself
        run: supabase functions deploy licence --yes --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Public key
        if: steps.ready.outputs.go == 'yes'
        run: |
          set -euo pipefail
          url="https://$PROJECT_REF.supabase.co/functions/v1/licence/public-key"
          for i in $(seq 1 12); do
            if curl -sf "$url" -o "$RUNNER_TEMP/pk.json"; then break; fi
            sleep 5
          done
          key=$(node -e "const k=String(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).public_key||'');if(Buffer.from(k,'base64').length!==32)process.exit(1);process.stdout.write(k)" "$RUNNER_TEMP/pk.json")
          echo "Licence public key: $key"
          {
            echo "### Licence signing is on"
            echo
            echo "Public key (Ed25519, base64), built into each program at release time:"
            echo
            echo "\`$key\`"
            echo
            echo "From $url. Next: run **Publish Riyeser release** so the programs check signatures."
          } >> "$GITHUB_STEP_SUMMARY"
