name: Windows app
# Builds the Riyeser Payroll Windows program (installer + portable .exe) on a Windows machine, checks it starts,
# and keeps the files for download (Actions → this run → Artifacts). Run it from the Actions tab, or push a tag like v1.0.1.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: desktop
      - name: Licence public key (from Riyeser's licence function; none until licence signing is switched on)
        shell: bash
        run: |
          # A public key, so it's fine in logs. 404: the function isn't deployed yet, so this build accepts unsigned
          # licences as before. Anything else that isn't a good key stops the build rather than ship without one.
          url="https://goaugynxeatzqzifpoes.supabase.co/functions/v1/licence/public-key"
          code=000
          for i in 1 2 3 4; do
            code=$(curl -sS -o "$RUNNER_TEMP/licence-key.json" -w '%{http_code}' "$url") || code=000
            if [ "$code" != 000 ] && [ "${code:0:1}" != 5 ]; then break; fi
            sleep 10
          done
          if [ "$code" = 200 ]; then
            key=$(node -e "const k=String(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).public_key||'');if(Buffer.from(k,'base64').length!==32)process.exit(1);process.stdout.write(k)" "$RUNNER_TEMP/licence-key.json") || { echo "The licence function's public key isn't a valid Ed25519 key"; exit 1; }
            echo "RIYESER_LICENCE_PUBLIC_KEY=$key" >> "$GITHUB_ENV"
            echo "Licence public key built in: $key"
          elif [ "$code" = 404 ]; then
            echo "Licence signing isn't set up yet: building without a public key (unsigned licences still work)."
          else
            echo "Couldn't fetch the licence public key (HTTP $code). Try again."; exit 1
          fi
      - run: npm run build
        working-directory: desktop
      - name: Check the program starts and its records work
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "desktop\dist\win-unpacked\Riyeser Payroll.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) { Start-Sleep 2; try { $r = Invoke-RestMethod http://127.0.0.1:37421/api/public/setup; if ($r.desktop) { $ok = $true; break } } catch {} }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The program did not start" }
          if (-not (Test-Path "$env:APPDATA\Riyeser Payroll\payroll\payroll.db")) { throw "No records file" }
          Write-Host "Started OK; records at $env:APPDATA\Riyeser Payroll\payroll"
      - uses: actions/upload-artifact@v4
        with:
          name: RiyeserPayroll-Windows
          path: |
            desktop/dist/*.exe
