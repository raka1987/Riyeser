name: HQ jobs

# Riyeser HQ's regular jobs on the Riyeser Link (Riyeser Team) database (see ops/RUNBOOK.md):
#   every hour   the support sweep: tickets with no first reply in 24 hours are flagged overdue; tickets waiting on us
#                for 48 hours are escalated one level ("No reply in 48 hours"). Both times are HQ settings.
#                A missed "next update to the customer" gets an internal reminder on the ticket and an email to its
#                owner (staff only; the customer isn't emailed).
#   every day    the inactive-accounts sweep: warning emails 30 and 7 days before a free account closes, closing after
#                12 months unused, and marking accounts closed for 2 years "ready for removal" (removal is never automatic).
#                Also website traffic: yesterday's daily totals are added and page views older than 13 months deleted.
#   every hour   PDF signing requests (Riyeser PDF "Ask someone to sign"): requests past their end date expire (the
#                sender is emailed) and links are taken out of sent emails of finished requests (sign_sweep).
#   after each   queued emails are sent through Resend, once RESEND_API_KEY and EMAIL_FROM are added. Until then they
#                stay queued and this says "email sending isn't set up yet" without failing.
# Connects with the TEAM_DB_URL secret, like the nightly backups. Never prints email addresses or message text.
on:
  schedule:
    - cron: "17 * * * *"       # every hour at :17
    - cron: "41 14 * * *"      # 14:41 UTC every day (after midnight in Fiji): the inactive-accounts sweep too
  workflow_dispatch:
    inputs:
      inactivity:
        description: "Also run the inactive-accounts sweep"
        type: boolean
        default: true

permissions:
  contents: read

concurrency: { group: hq-jobs, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.TEAM_DB_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      DAILY: ${{ (github.event_name == 'schedule' && github.event.schedule == '41 14 * * *') || (github.event_name == 'workflow_dispatch' && inputs.inactivity) }}
    steps:
      - name: Set up yet?
        id: ready
        run: |
          echo "STARTED=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
          if [ -z "$DB_URL" ]; then
            echo "::notice::HQ jobs aren't set up yet: the TEAM_DB_URL secret is missing (ops/RUNBOOK.md, Setting up backups)."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else echo "ok=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.ok == 'yes'
        uses: actions/checkout@v5
        with: { sparse-checkout: ops/hq-jobs }
      - if: steps.ready.outputs.ok == 'yes'
        name: PostgreSQL client
        run: command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
      - if: steps.ready.outputs.ok == 'yes'
        name: Database up to date?
        id: db
        run: |
          have=$(psql "$DB_URL" -X -q -At -c "select to_regprocedure('public.hq_support_sweep()') is not null")
          if [ "$have" != "t" ]; then
            echo "::notice::The database doesn't have the HQ jobs yet: re-run website/team/team-chat.sql in Supabase's SQL Editor (ops/RUNBOOK.md)."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else echo "ok=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.db.outputs.ok == 'yes'
        name: Support sweep (overdue, escalations and missed promised updates)
        run: |
          r=$(psql "$DB_URL" -X -q -At -v ON_ERROR_STOP=1 -c 'select public.hq_support_sweep()')
          echo "Support sweep: $r"
      - if: steps.db.outputs.ok == 'yes' && env.DAILY == 'true'
        name: Inactive-accounts sweep
        run: |
          r=$(psql "$DB_URL" -X -q -At -v ON_ERROR_STOP=1 -c 'select public.hq_inactivity_sweep()')
          echo "Inactive-accounts sweep: $r"
      - if: steps.db.outputs.ok == 'yes' && env.DAILY == 'true'
        name: Website traffic (daily totals; page views kept 13 months)
        run: |
          have=$(psql "$DB_URL" -X -q -At -c "select to_regprocedure('public.hq_traffic_sweep()') is not null")
          if [ "$have" != "t" ]; then echo "::notice::Website traffic isn't in the database yet: re-run website/team/team-chat.sql."; exit 0; fi
          r=$(psql "$DB_URL" -X -q -At -v ON_ERROR_STOP=1 -c 'select public.hq_traffic_sweep()')
          echo "Website traffic: $r"
      - if: steps.db.outputs.ok == 'yes'
        name: PDF signing requests (expire overdue requests, take links out of old emails)
        run: |
          have=$(psql "$DB_URL" -X -q -At -c "select to_regprocedure('public.sign_sweep()') is not null")
          if [ "$have" != "t" ]; then echo "::notice::PDF signing isn't in the database yet: re-run website/team/team-chat.sql."; exit 0; fi
          r=$(psql "$DB_URL" -X -q -At -v ON_ERROR_STOP=1 -c 'select public.sign_sweep()')
          echo "PDF signing: $r"
      - if: steps.db.outputs.ok == 'yes'
        name: Send queued emails
        run: bash ops/hq-jobs/send-emails.sh
      - if: always() && steps.db.outputs.ok == 'yes'
        name: Record the result in HQ (Integrations)
        env:
          RECORD_DB_URL: ${{ secrets.TEAM_DB_URL }}
          JOB: hq_jobs
          TARGET: team
          OK: ${{ job.status }}
        run: bash ops/hq-jobs/record-run.sh
      - if: failure()
        name: Tell the owner
        run: |
          echo "### ⚠️ An HQ job failed" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub emails the owner about failed scheduled runs. Open the red step; see ops/RUNBOOK.md (HQ jobs)." >> "$GITHUB_STEP_SUMMARY"
