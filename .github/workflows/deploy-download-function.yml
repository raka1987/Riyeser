name: Deploy download counter

# The "download" Edge Function (supabase/functions/download): riyeser.com's Download buttons hand off to it; it records
# one row per download (record_download in website/team/team-chat.sql, branch module/desk-assistant) and sends the
# browser on to the newest installer on GitHub. Riyeser HQ → Downloads shows the real numbers from it.
# Runs only when started by hand (Actions -> Deploy download counter -> Run workflow).
#
# Order: 1. "Update the Riyeser Link database" (so record_download is there), 2. this, 3. "Publish website".
# Until this is deployed the website's download page goes straight to GitHub, so nothing breaks in between.
#
# GitHub secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  a Supabase personal access token (the same one the other functions use)
#   DOWNLOAD_SALT          optional: a long random text for the daily visitor hash. Without it the function uses its
#                          service role key as the secret. Goes straight to the function's secrets through a pipe.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: deploy-download-function, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: goaugynxeatzqzifpoes   # public (it's in riyeser.com/link/config.js)
    steps:
      - name: Is it set up?
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Not set up yet: add the GitHub secret **SUPABASE_ACCESS_TOKEN**, then run this again." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'yes'
      - uses: denoland/setup-deno@v2
        if: steps.ready.outputs.go == 'yes'
        with: { deno-version: v2.x }
      - name: Test the download counter (a pretend database and GitHub)
        if: steps.ready.outputs.go == 'yes'
        run: deno test supabase/functions/download
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.go == 'yes'
        with: { version: latest }
      - name: Visitor hash secret (optional, from GitHub secrets straight to the function's secrets)
        if: steps.ready.outputs.go == 'yes'
        env:
          DOWNLOAD_SALT: ${{ secrets.DOWNLOAD_SALT }}
        run: |
          set -euo pipefail
          if [ -n "${DOWNLOAD_SALT:-}" ]; then
            if [ "${#DOWNLOAD_SALT}" -lt 32 ]; then echo "DOWNLOAD_SALT must be at least 32 characters."; exit 1; fi
            printf 'DOWNLOAD_SALT=%s\n' "$(printf '%s' "$DOWNLOAD_SALT" | tr -d '\r\n')" \
              | supabase secrets set --yes --env-file /dev/stdin --project-ref "$PROJECT_REF" > /dev/null
            echo "Saved DOWNLOAD_SALT as a function secret."
          else
            echo "No DOWNLOAD_SALT: the function uses its service role key as the hash secret."
          fi
      - name: Deploy the download function
        if: steps.ready.outputs.go == 'yes'
        # --no-verify-jwt: a download is a plain link with no sign-in
        run: supabase functions deploy download --yes --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Check it answers (ping, and a test download that HQ hides)
        if: steps.ready.outputs.go == 'yes'
        run: |
          set -euo pipefail
          base="https://$PROJECT_REF.supabase.co/functions/v1/download"
          for i in $(seq 1 12); do
            if curl -sf "$base/ping" -o "$RUNNER_TEMP/ping.json"; then break; fi
            sleep 5
          done
          node -e "const p=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!p.ok)process.exit(1);console.log('Download counter answers: version '+p.version)" "$RUNNER_TEMP/ping.json"
          # marked test (the header and the CI browser name), so it never shows as a real download
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'X-Riyeser-Test: 1' -A 'GitHub-Actions deploy check' "$base/central?test=1")
          echo "Central's download goes to: $loc"
          # The public downloads repository (docs/GOING-PRIVATE.md); the old code repository only until the downloads
          # repository has its first release (the function falls back to it while that answers "not found").
          case "$loc" in
            https://github.com/raka1987/riyeser-downloads/releases/*RiyeserCentral-Setup.exe) ;;
            https://github.com/raka1987/[Rr]iyeser/releases/*RiyeserCentral-Setup.exe) echo "::warning::Downloads still come from the old code repository: the downloads repository has no release yet (docs/GOING-PRIVATE.md, step 5).";;
            *) echo "::error::Unexpected download address"; exit 1;;
          esac
          {
            echo "### The download counter is live"
            echo
            echo "\`$base/<program>\` → the newest installer on GitHub. Next: **Publish website**, so riyeser.com's buttons use it."
          } >> "$GITHUB_STEP_SUMMARY"
