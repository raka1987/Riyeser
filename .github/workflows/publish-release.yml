name: Publish Riyeser release

# One button for a new public release of the Riyeser Windows programs:
#   Actions → "Publish Riyeser release" → Run workflow
# Builds Riyeser Central, Riyeser Documents (formerly Riyeser Desk Assistant), Riyeser PDF, As Built, Riyeser Link (formerly Riyeser Team) and Riyeser Link Office (branch module/desk-assistant) and Riyeser Accounting Basics and Plus
# and Riyeser POS (main) and Riyeser Payroll (branch module/payroll) on Windows, installs each one to check it, then publishes a GitHub Release whose files keep the same names
# every time, so the website's Download buttons (…/releases/latest/download/<name>) always give the newest version.
#
# Where the release goes (docs/GOING-PRIVATE.md):
#   1. raka1987/riyeser-downloads (DOWNLOADS_REPO below): the PUBLIC downloads repository. It holds only releases and
#      the built website, no source code. Needs the DOWNLOADS_TOKEN repository secret (a fine-grained token with
#      "Contents: Read and write" on that one repository). Without it the run stops at the start, before any build.
#   2. This (code) repository as well, while ALSO_CODE_REPO is on, so Riyeser Central 1.9.0 and older keep finding
#      updates here until they've updated themselves. Turn it off with the repository variable ALSO_CODE_REPO = false
#      (Settings → Secrets and variables → Actions → Variables), or untick "Also publish…" for one run.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (optional, shown on the release page)"
        required: false
        default: ""
      desktop_ref:
        description: "Branch or commit for Central, Documents, PDF, As Built, Link and Link Office"
        required: false
        default: module/desk-assistant
      also_code_repo:
        description: "Also publish to this code repository (for older Riyeser Central installs; ignored when the ALSO_CODE_REPO variable is false)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  # The public downloads repository (the one place to change its name in this workflow)
  DOWNLOADS_REPO: raka1987/riyeser-downloads
  # Publish to this code repository too: on unless the repository variable ALSO_CODE_REPO is "false" or the run's box is unticked
  ALSO_CODE_REPO: ${{ (vars.ALSO_CODE_REPO != 'false' && inputs.also_code_repo != false) && 'true' || 'false' }}

jobs:
  downloads-repo:
    name: Downloads repository access
    runs-on: ubuntu-latest
    steps:
      - name: Check the DOWNLOADS_TOKEN secret can publish to the downloads repository
        env: { GH_TOKEN: "${{ secrets.DOWNLOADS_TOKEN }}" }
        run: |
          # Checked first, so a missing token stops the run in seconds instead of after the 45-minute builds.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The DOWNLOADS_TOKEN secret is missing. Add it under Settings → Secrets and variables → Actions (see docs/GOING-PRIVATE.md, steps 2 and 3), then run this again."
            exit 1
          fi
          if ! gh api "repos/$DOWNLOADS_REPO" --jq .full_name >/dev/null 2>&1; then
            echo "::error::DOWNLOADS_TOKEN can't see $DOWNLOADS_REPO. Check the repository exists and the token was made for it, with \"Contents: Read and write\" (docs/GOING-PRIVATE.md, steps 1 and 2)."
            exit 1
          fi
          if [ "$(gh api "repos/$DOWNLOADS_REPO" --jq '.size')" = "0" ] && ! gh api "repos/$DOWNLOADS_REPO/commits?per_page=1" >/dev/null 2>&1; then
            echo "::error::$DOWNLOADS_REPO is empty. GitHub can't add a release to an empty repository: add a README to it (docs/GOING-PRIVATE.md, step 1)."
            exit 1
          fi
          echo "OK: releases will be published to $DOWNLOADS_REPO (and to this code repository too: $ALSO_CODE_REPO)."


  licence-key:
    name: Licence public key
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Licence public key (from Riyeser's licence function; none until licence signing is switched on)
        id: key
        shell: bash
        run: |
          # A public key, so it's fine in logs. 404: the function isn't deployed yet, so this build accepts unsigned
          # licences as before. Anything else that isn't a good key stops the build rather than ship without one.
          url="https://goaugynxeatzqzifpoes.supabase.co/functions/v1/licence/public-key"
          code=000
          for i in 1 2 3 4; do
            code=$(curl -sS -o "$RUNNER_TEMP/licence-key.json" -w '%{http_code}' "$url") || code=000
            if [ "$code" != 000 ] && [ "${code:0:1}" != 5 ]; then break; fi
            sleep 10
          done
          if [ "$code" = 200 ]; then
            key=$(node -e "const k=String(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).public_key||'');if(Buffer.from(k,'base64').length!==32)process.exit(1);process.stdout.write(k)" "$RUNNER_TEMP/licence-key.json") || { echo "The licence function's public key isn't a valid Ed25519 key"; exit 1; }
            echo "key=$key" >> "$GITHUB_OUTPUT"
            echo "Licence public key built in: $key"
          elif [ "$code" = 404 ]; then
            echo "Licence signing isn't set up yet: building without a public key (unsigned licences still work)."
          else
            echo "Couldn't fetch the licence public key (HTTP $code). Try again."; exit 1
          fi

  desktop:
    name: Central, Documents, PDF, As Built, Link, Link Office
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [licence-key, downloads-repo]
    # The licence public key, built into the program (empty until licence signing is switched on)
    env: { RIYESER_LICENCE_PUBLIC_KEY: "${{ needs.licence-key.outputs.key }}" }
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.desktop_ref || 'module/desk-assistant' }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          npm ci
          python -m pip install --quiet pillow
      - name: Unit tests
        run: npm test
      - name: Build installers
        run: node scripts/package-win.js
      - name: Install each one and check it is registered
        shell: pwsh
        run: |
          $apps = @(
            @{ id = "central"; src = "dist-central\RiyeserCentral-Setup-*.exe";        out = "RiyeserCentral-Setup.exe";        name = "Riy*ser Central*" },
            # Riyeser Documents (formerly Riyeser Desk Assistant): its build leaves a RiyeserDeskAssistant-Setup copy, and Windows
            # lists it as "Riyeser Documents" (an older build as "Riyeser Desk Assistant"): "Riyeser D*" matches either.
            @{ id = "desk"; src = "dist\RiyeserDeskAssistant-Setup-*.exe";        out = "RiyeserDeskAssistant-Setup.exe"; name = "Riyeser D*" },
            @{ id = "pdf"; src = "dist-pdf\RiyeserPDF-Setup-*.exe";              out = "RiyeserPDF-Setup.exe";            name = "Riyeser PDF*" },
            @{ id = "services"; src = "dist-services\RiyeserServices-Setup-*.exe";    out = "RiyeserServices-Setup.exe";       name = "As Built*" },
            # Riyeser Link (formerly Riyeser Team): the same app and release file, so installed copies update in place.
            @{ id = "team"; src = "dist-team\RiyeserTeam-Setup-*.exe";            out = "RiyeserTeam-Setup.exe";           name = "Riyeser Link [0-9]*" },
            # Riyeser Link Office installs for the whole PC (HKLM), so its installer can add its Windows Firewall rule.
            @{ id = "linkoffice"; src = "dist-linkoffice\RiyeserLinkOffice-Setup-*.exe"; out = "RiyeserLinkOffice-Setup.exe"; name = "Riyeser Link Office*"; machine = $true })
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $versions = @(); $ids = [ordered]@{}
          foreach ($a in $apps) {
            $setup = Get-ChildItem $a.src | Select-Object -First 1
            if (-not $setup) { throw "Missing installer: $($a.src)" }
            Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
            $hive = if ($a.machine) { "HKLM" } else { "HKCU" }
            $entry = Get-ItemProperty "$($hive):\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object DisplayName -like $a.name
            if (-not $entry) { throw "Not installed: $($a.name)" }
            Write-Host "OK:" $entry.DisplayName
            $versions += "$($entry.DisplayName)"
            $v = if ($entry.DisplayVersion) { $entry.DisplayVersion } else { ($entry.DisplayName -replace '^.*?(\d+(\.\d+)+)\s*$', '$1') }
            $ids[$a.id] = "$v"
            Copy-Item $setup.FullName (Join-Path release $a.out)
          }
          # M3: Riyeser Link's installer under its new name too (the same file; RiyeserTeam-Setup.exe stays for old links and Centrals).
          Copy-Item (Join-Path release "RiyeserTeam-Setup.exe") (Join-Path release "RiyeserLink-Setup.exe")
          # Riyeser Documents' installer under its new name too (the same file; RiyeserDeskAssistant-Setup.exe stays for
          # old download links and older Centrals). versions.json keeps the id "desk", which every Central looks for.
          Copy-Item (Join-Path release "RiyeserDeskAssistant-Setup.exe") (Join-Path release "RiyeserDocuments-Setup.exe")
          $versions | Set-Content release\versions-desktop.txt
          # versions.json: each program's version by its id. Riyeser Central (1.7 and later) reads it first, so older
          # Centrals still find "team" (now listed as Riyeser Link) and offer the update.
          $ids | ConvertTo-Json | Set-Content release\versions.json
      - uses: actions/upload-artifact@v4
        with: { name: desktop, path: desktop/release/*, if-no-files-found: error }

  accounting:
    name: Accounting Basics, Accounting Plus, POS, Invoices, Bookings and Estimate
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [licence-key, downloads-repo]
    # The licence public key, built into the program (empty until licence signing is switched on)
    # RIYESER_ESRI_KEY: Riyeser Estimate's map (ArcGIS Location Platform API key; optional, a repository secret)
    env: { RIYESER_LICENCE_PUBLIC_KEY: "${{ needs.licence-key.outputs.key }}", RIYESER_ESRI_KEY: "${{ secrets.RIYESER_ESRI_KEY }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the three apps and their installers
        shell: pwsh
        run: |
          pip install . pyinstaller
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          foreach ($ed in "basics", "plus", "pos", "invoices", "bookings", "estimate") {
            python packaging/build_desktop.py --edition $ed
            if ($LASTEXITCODE -ne 0) { throw "$ed build failed" }
            & $iscc "/DEdition=$ed" "/DAppVersion=$ver" packaging\installer.iss
            if ($LASTEXITCODE -ne 0) { throw "$ed installer build failed" }
          }
      - name: Install each one to check it, and that each replaces the other
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          function Installed { @((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Accounting*").DisplayName) }
          foreach ($app in @(@{ ed = "Basics"; file = "RiyeserAccountingBasics-Setup" }, @{ ed = "Plus"; file = "RiyeserAccountingPlus-Setup" })) {
            $setup = Get-ChildItem "dist\$($app.file)-*.exe" | Select-Object -First 1
            Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
            $now = @(Installed)
            if ($now.Count -ne 1 -or $now[0] -notlike "Riyeser Accounting $($app.ed) *") { throw "Expected only Riyeser Accounting $($app.ed), found: $now" }
            Write-Host "OK:" $now[0]
            Copy-Item $setup.FullName "release\$($app.file).exe"
            "$($now[0])" | Set-Content "release\versions-accounting-$($app.ed.ToLower()).txt"
          }
          # Riyeser POS installs next to Accounting (Plus stays installed).
          $setup = Get-ChildItem "dist\RiyeserPOS-Setup-*.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $pos = @((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser POS*").DisplayName)
          if ($pos.Count -ne 1) { throw "Riyeser POS is not listed in Installed apps" }
          $now = @(Installed)
          if ($now.Count -ne 1 -or $now[0] -notlike "Riyeser Accounting Plus *") { throw "Installing POS should leave Accounting Plus installed, found: $now" }
          Write-Host "OK:" $pos[0]
          Copy-Item $setup.FullName "release\RiyeserPOS-Setup.exe"
          "$($pos[0])" | Set-Content "release\versions-pos.txt"
          # Riyeser Invoices (free) installs next to Accounting and POS too.
          $setup = Get-ChildItem "dist\RiyeserInvoices-Setup-*.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $inv = @((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Invoices*").DisplayName)
          if ($inv.Count -ne 1) { throw "Riyeser Invoices is not listed in Installed apps" }
          if (@(Installed).Count -ne 1) { throw "Installing Invoices changed Accounting" }
          Write-Host "OK:" $inv[0]
          Copy-Item $setup.FullName "release\RiyeserInvoices-Setup.exe"
          "$($inv[0])" | Set-Content "release\versions-invoices.txt"
          # Riyeser Bookings installs next to them all too.
          $setup = Get-ChildItem "dist\RiyeserBookings-Setup-*.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $bk = @((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Bookings*").DisplayName)
          if ($bk.Count -ne 1) { throw "Riyeser Bookings is not listed in Installed apps" }
          if (@(Installed).Count -ne 1) { throw "Installing Bookings changed Accounting" }
          Write-Host "OK:" $bk[0]
          Copy-Item $setup.FullName "release\RiyeserBookings-Setup.exe"
          "$($bk[0])" | Set-Content "release\versions-bookings.txt"
          # Riyeser Estimate (measure jobs and quote them) installs next to them all too.
          $setup = Get-ChildItem "dist\RiyeserEstimate-Setup-*.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $es = @((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Estimate*").DisplayName)
          if ($es.Count -ne 1) { throw "Riyeser Estimate is not listed in Installed apps" }
          if (-not (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Bookings*")) { throw "Installing Estimate removed Riyeser Bookings" }
          if (@(Installed).Count -ne 1) { throw "Installing Estimate changed Accounting" }
          Write-Host "OK:" $es[0]
          Copy-Item $setup.FullName "release\RiyeserEstimate-Setup.exe"
          "$($es[0])" | Set-Content "release\versions-estimate.txt"
          # Older Riyeser Central (1.3.6 and before) and old links download RiyeserAccounting-Setup.exe: give them Plus.
          Copy-Item release\RiyeserAccountingPlus-Setup.exe release\RiyeserAccounting-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: accounting, path: release/*, if-no-files-found: error }

  payroll:
    name: Payroll
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [licence-key, downloads-repo]
    # The licence public key, built into the program (empty until licence signing is switched on)
    env: { RIYESER_LICENCE_PUBLIC_KEY: "${{ needs.licence-key.outputs.key }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: module/payroll }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Build installer
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Install it and check it is registered and starts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $setup = Get-ChildItem desktop\dist\RiyeserPayroll-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "No Payroll installer was built" }
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $entry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*, HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | Where-Object DisplayName -like "Riyeser Payroll*" | Select-Object -First 1
          if (-not $entry) { throw "Riyeser Payroll is not listed in Installed apps" }
          Write-Host "OK:" $entry.DisplayName "installed in" $entry.InstallLocation
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter "Riyeser Payroll.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "Riyeser Payroll.exe not found after installing" }
          Write-Host "Program:" $exe
          if ($exe -notlike "$env:LOCALAPPDATA\Programs\*") { throw "Riyeser Payroll installed outside the user's Programs folder: $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) { Start-Sleep 2; try { $r = Invoke-RestMethod http://127.0.0.1:37421/api/public/setup; if ($r) { $ok = $true; break } } catch {} }
          Get-Process | Where-Object { $_.Path -like "*riyeser-payroll*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Riyeser Payroll did not start" }
          $v = if ($entry.DisplayVersion) { "Riyeser Payroll $($entry.DisplayVersion)" } else { $entry.DisplayName }
          $v | Set-Content release\versions-payroll.txt
          Copy-Item $setup.FullName release\RiyeserPayroll-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: payroll, path: release/*, if-no-files-found: error }

  publish:
    name: Publish release
    needs: [desktop, accounting, payroll]
    # Payroll is newest: if its build or check fails, the other programs are still published (Payroll joins next time).
    if: ${{ !cancelled() && needs.desktop.result == 'success' && needs.accounting.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Keep the previous installer of any program whose new build failed
        env: { DL_TOKEN: "${{ secrets.DOWNLOADS_TOKEN }}", CODE_TOKEN: "${{ github.token }}" }
        run: |
          # Looks in the downloads repository first, then in this code repository (older releases are only here).
          for f in RiyeserPayroll-Setup.exe; do
            [ -f "out/$f" ] && continue
            found=""
            for spot in "$DOWNLOADS_REPO DL_TOKEN" "$GITHUB_REPOSITORY CODE_TOKEN"; do
              set -- $spot; repo="$1"; export GH_TOKEN="${!2}"
              for t in $(gh release list -R "$repo" -L 30 --json tagName -q '.[].tagName' 2>/dev/null); do
                if gh release view "$t" -R "$repo" --json assets -q '.assets[].name' | grep -qx "$f"; then
                  gh release download "$t" -R "$repo" -p "$f" -D out
                  gh release view "$t" -R "$repo" --json body -q .body | grep -E "^- Riyeser Payroll " | sed 's/^- //' > out/versions-payroll.txt || true
                  echo "Kept $f from $repo $t (its new build didn't pass)"; found=1; break
                fi
              done
              [ -n "$found" ] && break
            done
            [ -n "$found" ] || echo "No earlier $f to keep"
          done
      - name: Release notes
        env: { NOTES: "${{ inputs.notes }}" }
        run: |
          {
            echo "Windows programs from Riyeser. **Free for 90 days, no sign-up, no card, works offline.** Windows 10 and 11."
            echo
            if [ -n "$NOTES" ]; then echo "### What's new"; echo "$NOTES"; echo; fi
            echo "### In this release"
            cat out/versions-*.txt | sed 's/^/- /'
            echo
            echo "**Installing:** run the file. If Windows shows \"Windows protected your PC\", click **More info → Run anyway**. Each program installs for your Windows user (no admin rights needed) and updates over the old version, keeping your data. Riyeser Link (formerly Riyeser Team) updates over Riyeser Team, keeping your sign-in and chats. Riyeser Documents (formerly Riyeser Desk Assistant) updates over Desk Assistant. Riyeser Link Office installs for the whole PC, so Windows asks for permission once (it adds a firewall rule so the office's desk phones can reach it)."
            echo
            echo "Every installer was built, installed and checked on Windows before publishing."
          } > notes.md
          echo "TAG=riyeser-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "TITLE=Riyeser for Windows — $(date -u '+%-d %B %Y')" >> "$GITHUB_ENV"
          rm out/versions-*.txt
          ls -la out
      - name: Publish to the downloads repository (${{ env.DOWNLOADS_REPO }})
        env: { GH_TOKEN: "${{ secrets.DOWNLOADS_TOKEN }}" }
        run: |
          # The same tag, title, notes and file names as the code repository's copy below. (Payroll's file may be
          # missing if its job failed; the others were checked above.)
          files=()
          for f in RiyeserCentral-Setup.exe RiyeserDocuments-Setup.exe RiyeserDeskAssistant-Setup.exe RiyeserPDF-Setup.exe \
                   RiyeserServices-Setup.exe RiyeserTeam-Setup.exe RiyeserLink-Setup.exe RiyeserLinkOffice-Setup.exe versions.json \
                   RiyeserAccountingBasics-Setup.exe RiyeserAccountingPlus-Setup.exe RiyeserAccounting-Setup.exe RiyeserPOS-Setup.exe \
                   RiyeserInvoices-Setup.exe RiyeserBookings-Setup.exe RiyeserEstimate-Setup.exe RiyeserPayroll-Setup.exe; do
            if [ -f "out/$f" ]; then files+=("out/$f"); else echo "Not in this release: $f"; fi
          done
          if gh release view "$TAG" -R "$DOWNLOADS_REPO" >/dev/null 2>&1; then
            # A re-run of the same run: replace the files on the release that's already there
            gh release upload "$TAG" -R "$DOWNLOADS_REPO" --clobber "${files[@]}"
          else
            gh release create "$TAG" -R "$DOWNLOADS_REPO" --title "$TITLE" --notes-file notes.md --latest "${files[@]}"
          fi
          echo "Published $TAG to https://github.com/$DOWNLOADS_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
      # The code repository's copy (transition: older Centrals look here). Still runs if the step above failed, so
      # older installs aren't left without the update; the run then shows as failed so the downloads copy gets redone.
      - if: ${{ !cancelled() && env.ALSO_CODE_REPO == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: module/desk-assistant
          name: ${{ env.TITLE }}
          body_path: notes.md
          make_latest: "true"
          files: |
            out/RiyeserCentral-Setup.exe
            out/RiyeserDocuments-Setup.exe
            out/RiyeserDeskAssistant-Setup.exe
            out/RiyeserPDF-Setup.exe
            out/RiyeserServices-Setup.exe
            out/RiyeserTeam-Setup.exe
            out/RiyeserLink-Setup.exe
            out/RiyeserLinkOffice-Setup.exe
            out/versions.json
            out/RiyeserAccountingBasics-Setup.exe
            out/RiyeserAccountingPlus-Setup.exe
            out/RiyeserAccounting-Setup.exe
            out/RiyeserPOS-Setup.exe
            out/RiyeserInvoices-Setup.exe
            out/RiyeserBookings-Setup.exe
            out/RiyeserEstimate-Setup.exe
            out/RiyeserPayroll-Setup.exe
          fail_on_unmatched_files: false  # Payroll's file may be missing if its job failed; the others are checked above
