name: Website (riyeser.com)

# Builds the Riyser website (website/build.mjs) and publishes it with GitHub Pages.
# Run it from the Actions tab ("Run workflow") once Pages is switched on:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node website/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: website/public }
      - id: deploy
        uses: actions/deploy-pages@v4
