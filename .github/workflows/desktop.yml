name: Build desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        edition: [basics, plus, pos]
    runs-on: ${{ matrix.os }}
    env:
      APP: ${{ fromJSON('{"basics":"Riyeser Accounting Basics","plus":"Riyeser Accounting Plus","pos":"Riyeser POS"}')[matrix.edition] }}
      LINUX_APP: ${{ fromJSON('{"basics":"riyeser-accounting-basics","plus":"riyeser-accounting-plus","pos":"riyeser-pos"}')[matrix.edition] }}
      SETUP: ${{ fromJSON('{"basics":"RiyeserAccountingBasics-Setup","plus":"RiyeserAccountingPlus-Setup","pos":"RiyeserPOS-Setup"}')[matrix.edition] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install . pyinstaller
      - name: Build
        run: python packaging/build_desktop.py --edition ${{ matrix.edition }}
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          RIYESER_HOME=$RUNNER_TEMP/rh "./dist/$LINUX_APP" --no-window --port 8765 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8765/setup -o page.html; then
              grep -q "$APP" page.html || { echo "Setup page doesn't say $APP"; exit 1; }
              echo OK; exit 0
            fi
            sleep 1
          done; exit 1
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DEdition=${{ matrix.edition }}" "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Install on Windows and check it opens in its own window (offline)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist\$env:SETUP-*.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\$env:APP\$env:APP.exe"
          if (-not (Test-Path $exe)) { throw "Not installed" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\$env:APP.lnk")) { throw "No desktop shortcut" }
          $entry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "$env:APP*"
          if (-not $entry) { throw "Not listed in Installed apps" }
          Write-Host "Listed as:" $entry.DisplayName "by" $entry.Publisher
          $env:RIYESER_HOME = "$env:RUNNER_TEMP\rh-installed"
          Start-Process $exe
          # The one-file program starts a second copy of itself, which opens the window: check every copy.
          $title = ""
          for ($i = 0; $i -lt 120 -and -not $title; $i++) {
            Start-Sleep 1
            $title = (Get-Process -Name $env:APP -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle } | Select-Object -First 1).MainWindowTitle
          }
          $browsers = Get-Process msedge, chrome -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -and $_.MainWindowTitle -notlike "*Riyeser*" }
          Get-Process -Name $env:APP -ErrorAction SilentlyContinue | Format-Table Id, MainWindowTitle -AutoSize | Out-String | Write-Host
          Get-Process -Name $env:APP -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $title) { throw "No app window appeared" }
          Write-Host "App window:" $title
          if ($title -notlike "$env:APP*") { throw "Window title should start with $env:APP" }
          if ($browsers) { throw "It opened a web browser instead of its own window" }
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "$APP.app" "${APP// /-}-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*-macOS.zip
            dist/riyeser-accounting-*
            dist/riyeser-pos
          if-no-files-found: error

  switch:
    # Basics -> Plus -> Basics on one PC: only one Accounting app installed at a time, and the company file is never
    # touched. Then Riyeser POS, which installs next to Accounting.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "*-Windows", path: out, merge-multiple: true }
      - name: Upgrade and downgrade keep the books
        shell: pwsh
        run: |
          $basics = Get-ChildItem out\RiyeserAccountingBasics-Setup-*.exe | Select-Object -First 1
          $plus = Get-ChildItem out\RiyeserAccountingPlus-Setup-*.exe | Select-Object -First 1
          function Installed { (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Accounting*").DisplayName }
          function Run($f) { Start-Process $f.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait }
          Run $basics
          # Stand-in company file: it must come through every switch byte for byte.
          $db = "$env:USERPROFILE\.riyeser\company.db"
          New-Item -ItemType Directory -Force -Path (Split-Path $db) | Out-Null
          [IO.File]::WriteAllBytes($db, [byte[]](1..200))
          $size = (Get-FileHash $db).Hash
          Write-Host "Basics:" (Installed)
          Run $plus
          $now = @(Installed); Write-Host "After Plus:" $now
          if ($now.Count -ne 1 -or $now[0] -notlike "Riyeser Accounting Plus*") { throw "Plus should replace Basics" }
          if ((Get-FileHash $db).Hash -ne $size) { throw "Company file changed on upgrade" }
          Run $basics
          $now = @(Installed); Write-Host "After Basics:" $now
          if ($now.Count -ne 1 -or $now[0] -notlike "Riyeser Accounting Basics*") { throw "Basics should replace Plus" }
          if ((Get-FileHash $db).Hash -ne $size) { throw "Company file changed on downgrade" }
          Write-Host "OK: one app at a time, books kept"
          # Riyeser POS sits next to Accounting: installing it must not remove Basics, and it opens the same books.
          $pos = Get-ChildItem out\RiyeserPOS-Setup-*.exe | Select-Object -First 1
          Run $pos
          $now = @(Installed); Write-Host "After POS, Accounting:" $now
          if ($now.Count -ne 1 -or $now[0] -notlike "Riyeser Accounting Basics*") { throw "Installing POS should leave Accounting Basics installed" }
          $posEntry = (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser POS*").DisplayName
          if (-not $posEntry) { throw "Riyeser POS is not listed in Installed apps" }
          Run $plus
          if (-not (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser POS*")) { throw "Installing Plus removed Riyeser POS" }
          if ((Get-FileHash $db).Hash -ne $size) { throw "Company file changed" }
          Write-Host "OK: Riyeser POS installs next to Accounting:" $posEntry

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
