name: Build desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: Riyeser-Accounting-Windows }
          - { os: macos-latest,   artifact: Riyeser-Accounting-macOS }
          - { os: ubuntu-latest,  artifact: Riyeser-Accounting-Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install . pyinstaller
      - name: Build
        run: python packaging/build_desktop.py
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          RIYESER_HOME=$RUNNER_TEMP/rh ./dist/riyeser-accounting --no-window --port 8765 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/setup >/dev/null && echo OK && exit 0; sleep 1; done; exit 1
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Install on Windows and check it opens in its own window (offline)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\RiyeserAccounting-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Riyeser Accounting\Riyeser Accounting.exe"
          if (-not (Test-Path $exe)) { throw "Not installed" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Riyeser Accounting.lnk")) { throw "No desktop shortcut" }
          $entry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Accounting*"
          if (-not $entry) { throw "Not listed in Installed apps" }
          Write-Host "Listed as:" $entry.DisplayName "by" $entry.Publisher
          $env:RIYESER_HOME = "$env:RUNNER_TEMP\rh-installed"
          $p = Start-Process $exe -PassThru
          $title = ""
          for ($i = 0; $i -lt 90 -and -not $title; $i++) { Start-Sleep 1; $p.Refresh(); $title = (Get-Process -Id $p.Id).MainWindowTitle }
          $browsers = Get-Process msedge, chrome -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $title) { throw "No app window appeared" }
          Write-Host "App window:" $title
          if ($browsers) { throw "It opened a web browser instead of its own window" }
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "Riyeser Accounting.app" Riyeser-Accounting-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Riyeser Accounting.exe
            dist/RiyeserAccounting-Setup-*.exe
            dist/Riyeser-Accounting-macOS.zip
            dist/riyeser-accounting
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
