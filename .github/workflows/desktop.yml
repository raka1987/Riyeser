name: Build desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: Riyeser-Accounting-Windows }
          - { os: macos-latest,   artifact: Riyeser-Accounting-macOS }
          - { os: ubuntu-latest,  artifact: Riyeser-Accounting-Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install . pyinstaller
      - name: Build
        run: python packaging/build_desktop.py
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          RIYESER_HOME=$RUNNER_TEMP/rh ./dist/riyeser-accounting --no-window --port 8765 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/setup >/dev/null && echo OK && exit 0; sleep 1; done; exit 1
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "Riyeser Accounting.app" Riyeser-Accounting-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Riyeser Accounting.exe
            dist/Riyeser-Accounting-macOS.zip
            dist/riyeser-accounting
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
