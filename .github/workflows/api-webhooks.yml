name: API webhooks

# Sends the online connections API's webhooks that are due (what the PCs announced: booking confirmed/cancelled,
# order ready/completed, stock changed; and every retry), and tidies up (post box 90 days, request log and deliveries
# 30 days): POST /functions/v1/api/internal/dispatch. What websites send is already sent straight away by the API.
# Every 5 minutes (GitHub may run it a little later when it's busy), or by hand.
#
# Uses the GitHub secret API_CRON_SECRET if there is one (the same value the deploy workflow gave the function);
# otherwise it reads the project's service role key with SUPABASE_ACCESS_TOKEN, masked, never printed or saved.
# Without either, or before the api function is deployed, it says so and stops without failing.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: api-webhooks, cancel-in-progress: false }

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      API_CRON_SECRET: ${{ secrets.API_CRON_SECRET }}
      PROJECT_REF: goaugynxeatzqzifpoes
    steps:
      - name: Is it set up?
        id: ready
        run: |
          if [ -z "$API_CRON_SECRET" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::API webhooks aren't set up yet: add SUPABASE_ACCESS_TOKEN (or API_CRON_SECRET) to GitHub secrets."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.go == 'yes' && env.API_CRON_SECRET == ''
        with: { version: latest }
      - name: Send what's due
        if: steps.ready.outputs.go == 'yes'
        run: |
          set -euo pipefail
          token="${API_CRON_SECRET:-}"
          if [ -z "$token" ]; then
            token=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json 2>/dev/null \
              | jq -r '[.[] | select(.name == "service_role") | .api_key][0] // empty')
          fi
          if [ -z "$token" ]; then echo "::notice::Couldn't read the service role key: add API_CRON_SECRET (see deploy-api-function.yml)."; exit 0; fi
          echo "::add-mask::$token"
          url="https://$PROJECT_REF.supabase.co/functions/v1/api/internal/dispatch"
          code=$(curl -s -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $token" --max-time 120 "$url" || true)
          if [ "$code" = "404" ]; then echo "::notice::The api function isn't deployed yet (Deploy online connections API)."; exit 0; fi
          if [ "$code" != "200" ]; then echo "The dispatcher answered $code."; exit 1; fi
          # only counts are printed (never addresses, payloads or secrets)
          jq -c '{sent, failed, sweep}' "$RUNNER_TEMP/out.json"
