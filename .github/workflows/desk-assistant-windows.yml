name: Riyeser Central + Desk Assistant + PDF + As Built + Team + Link (Windows)

# Builds the Windows installers for Riyeser Central, Riyeser Desk Assistant and Riyeser PDF,
# installs them on a clean Windows machine and checks they are registered.
on:
  push:
    branches: [module/desk-assistant]
    paths: ["desktop/**", ".github/workflows/desk-assistant-windows.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        run: |
          npm ci
          python -m pip install --quiet pillow

      - name: Unit tests
        run: npm test

      - name: Build installers
        run: node scripts/package-win.js

      - name: Install silently and check both apps
        shell: pwsh
        run: |
          foreach ($app in @(
              @{ setup = "dist\RiyeserDeskAssistant-Setup-*.exe"; exe = "Riyeser Desk Assistant.exe"; name = "Riyeser Desk Assistant*" },
              @{ setup = "dist-pdf\RiyeserPDF-Setup-*.exe"; exe = "Riyeser PDF.exe"; name = "Riyeser PDF*" },
              @{ setup = "dist-central\RiyeserCentral-Setup-*.exe"; exe = "Riyeser Central.exe"; name = "Riyeser Central*" },
              @{ setup = "dist-services\RiyeserServices-Setup-*.exe"; exe = "Riyeser Services.exe"; name = "As Built*" },
              @{ setup = "dist-team\RiyeserTeam-Setup-*.exe"; exe = "Riyeser Team.exe"; name = "Riyeser Team*" })) {
            $setup = Get-ChildItem $app.setup | Select-Object -First 1
            Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter $app.exe | Select-Object -First 1
            if (-not $exe) { throw "Installed app not found: $($app.exe)" }
            Write-Host "Installed:" $exe.FullName
            $entry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like $app.name
            if (-not $entry) { throw "Not listed in Installed apps: $($app.name)" }
            Write-Host "Listed as:" $entry.DisplayName "by" $entry.Publisher
          }
          # Riyeser Link installs for the whole PC (Program Files, HKLM) and adds its Windows Firewall rule
          $lsetup = Get-ChildItem "dist-link\RiyeserLink-Setup-*.exe" | Select-Object -First 1
          Start-Process -FilePath $lsetup.FullName -ArgumentList "/S" -Wait
          $link = @("$env:ProgramFiles\riyeser-link\Riyeser Link.exe", "$env:ProgramFiles\Riyeser Link\Riyeser Link.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $link) { $link = (Get-ChildItem "$env:ProgramFiles" -Depth 2 -Filter "Riyeser Link.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          if (-not $link) { throw "Installed app not found: Riyeser Link.exe" }
          Write-Host "Installed:" $link
          $lentry = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Link*"
          if (-not $lentry) { throw "Not listed in Installed apps: Riyeser Link" }
          Write-Host "Listed as:" $lentry.DisplayName "by" $lentry.Publisher
          $rule = cmd /c 'netsh advfirewall firewall show rule name="Riyeser Link" verbose' | Out-String
          if ($LASTEXITCODE -ne 0 -or $rule -notmatch "5060" -or $rule -notmatch [regex]::Escape($link)) { throw "Riyeser Link's firewall rule is missing: $rule" }
          Write-Host "Firewall rule added for" $link
          $lreport = "$env:RUNNER_TEMP\link.json"
          Start-Process -FilePath $link -ArgumentList "--self-test=$lreport" -Wait
          $l = Get-Content $lreport -Raw | ConvertFrom-Json
          if (-not ($l.ok -and $l.sip -and $l.provisioning)) { throw "Riyeser Link's self-test failed: $($l | ConvertTo-Json -Compress)" }
          Write-Host "Riyeser Link" $l.version "registers phones, connects a test call and sets up a desk phone"
          # Riyeser Central must find the other programs it opens
          $central = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Central.exe" | Select-Object -First 1
          $report = "$env:RUNNER_TEMP\central.json"
          Start-Process -FilePath $central.FullName -ArgumentList "--self-test=$report" -Wait
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $r.programs | Format-Table id, status, where -AutoSize | Out-String | Write-Host
          foreach ($id in @("desk", "pdf", "services", "team", "link")) { if (($r.programs | Where-Object id -eq $id).status -ne "installed") { throw "Riyeser Central can't find $id" } }
          Write-Host "Riyeser Central" $r.version "finds Desk Assistant, PDF and As Built"
          # As Built must carry its own copy of the app (works with no internet)
          $svc = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Services.exe" | Select-Object -First 1
          $sreport = "$env:RUNNER_TEMP\services.json"
          Start-Process -FilePath $svc.FullName -ArgumentList "--self-test=$sreport" -Wait
          $s = Get-Content $sreport -Raw | ConvertFrom-Json
          if (-not ($s.bundled -and $s.appPage -and $s.start)) { throw "As Built is missing its offline copy: $($s | ConvertTo-Json -Compress)" }
          Write-Host "As Built" $s.version "works offline (app files inside the program)"
          # Riyeser Team starts, and sets itself to start with Windows (so calls can ring)
          $team = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Team.exe" | Select-Object -First 1
          $treport = "$env:RUNNER_TEMP\team.json"
          Start-Process -FilePath $team.FullName -ArgumentList "--hidden", "--self-test=$treport" -Wait
          $t = Get-Content $treport -Raw | ConvertFrom-Json
          if (-not ($t.ok -and $t.loginItem)) { throw "Riyeser Team didn't start properly: $($t | ConvertTo-Json -Compress)" }
          Write-Host "Riyeser Team" $t.version "starts, and starts with Windows"
          # Uninstalling Riyeser Link removes its firewall rule
          $un = Get-ChildItem (Split-Path $link) -Filter "Uninstall*.exe" | Select-Object -First 1
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait
          $gone = $false
          for ($i = 0; $i -lt 60 -and -not $gone; $i++) { Start-Sleep -Seconds 2; cmd /c 'netsh advfirewall firewall show rule name="Riyeser Link"' | Out-Null; $gone = ($LASTEXITCODE -ne 0) }
          if (-not $gone) { throw "Riyeser Link's firewall rule is still there after uninstalling" }
          Write-Host "Uninstalling Riyeser Link removed its firewall rule"
          $global:LASTEXITCODE = 0
          $leftover = Get-ChildItem "$env:LOCALAPPDATA\Programs\desk-assistant\resources" -Directory | Where-Object Name -in @("python", "accounting")
          if ($leftover) { throw "Accounting files are still bundled" }

      - uses: actions/upload-artifact@v4
        with:
          name: Riyeser-Windows-installers
          path: |
            desktop/dist/RiyeserDeskAssistant-Setup-*.exe
            desktop/dist-pdf/RiyeserPDF-Setup-*.exe
            desktop/dist-central/RiyeserCentral-Setup-*.exe
            desktop/dist-services/RiyeserServices-Setup-*.exe
            desktop/dist-team/RiyeserTeam-Setup-*.exe
            desktop/dist-link/RiyeserLink-Setup-*.exe
          if-no-files-found: error
