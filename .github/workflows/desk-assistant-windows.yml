name: Riyeser Central + Documents + PDF + As Built + Link + Link Office (Windows)

# Builds the Windows installers for Riyeser Central, Riyeser Documents (formerly Desk Assistant), Riyeser PDF and the rest,
# installs them on a clean Windows machine and checks they are registered.
on:
  push:
    branches: [module/desk-assistant]
    paths: ["desktop/**", ".github/workflows/desk-assistant-windows.yml"]
  workflow_dispatch:
    inputs:
      job:
        description: "all, windows (build and check the installers), central-install (installs every program from the latest release the way Central does) or link-ip (Link Office follows a new address on a real adapter)"
        default: all

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'windows'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        run: |
          npm ci
          python -m pip install --quiet pillow

      - name: Unit tests
        run: npm test

      - name: Licence public key (from Riyeser's licence function; none until licence signing is switched on)
        shell: bash
        run: |
          # A public key, so it's fine in logs. 404: the function isn't deployed yet, so this build accepts unsigned
          # licences as before. Anything else that isn't a good key stops the build rather than ship without one.
          url="https://goaugynxeatzqzifpoes.supabase.co/functions/v1/licence/public-key"
          code=000
          for i in 1 2 3 4; do
            code=$(curl -sS -o "$RUNNER_TEMP/licence-key.json" -w '%{http_code}' "$url") || code=000
            if [ "$code" != 000 ] && [ "${code:0:1}" != 5 ]; then break; fi
            sleep 10
          done
          if [ "$code" = 200 ]; then
            key=$(node -e "const k=String(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).public_key||'');if(Buffer.from(k,'base64').length!==32)process.exit(1);process.stdout.write(k)" "$RUNNER_TEMP/licence-key.json") || { echo "The licence function's public key isn't a valid Ed25519 key"; exit 1; }
            echo "RIYESER_LICENCE_PUBLIC_KEY=$key" >> "$GITHUB_ENV"
            echo "Licence public key built in: $key"
          elif [ "$code" = 404 ]; then
            echo "Licence signing isn't set up yet: building without a public key (unsigned licences still work)."
          else
            echo "Couldn't fetch the licence public key (HTTP $code). Try again."; exit 1
          fi
      - name: Build installers
        run: node scripts/package-win.js

      - name: Install silently and check both apps
        shell: pwsh
        run: |
          # Riyeser Link was called Riyeser Team. Install the released Riyeser Team first, so the new build is checked
          # as an update over it: same folder and program file, one Installed apps entry, sign-in folder kept.
          # M3: the installer is RiyeserLink-Setup now, with a RiyeserTeam-Setup copy for the old name
          $lk = Get-ChildItem "dist-team\RiyeserLink-Setup-*.exe" | Select-Object -First 1
          $tm = Get-ChildItem "dist-team\RiyeserTeam-Setup-*.exe" | Select-Object -First 1
          if (-not $lk -or -not $tm -or (Get-FileHash $lk.FullName).Hash -ne (Get-FileHash $tm.FullName).Hash) { throw "Expected RiyeserLink-Setup and the same file as RiyeserTeam-Setup in dist-team" }
          $old = "$env:RUNNER_TEMP\RiyeserTeam-old.exe"
          Invoke-WebRequest "https://github.com/raka1987/Riyeser/releases/latest/download/RiyeserTeam-Setup.exe" -OutFile $old
          Start-Process -FilePath $old -ArgumentList "/S" -Wait
          $oldEntry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -like "Riyeser Team*" -or $_.DisplayName -like "Riyeser Link [0-9]*" }
          if (-not $oldEntry) { throw "The released Riyeser Team didn't install" }
          Write-Host "Released copy installed first:" $oldEntry.DisplayName
          $oldExe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Team.exe" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\Riyeser Team" | Out-Null
          Set-Content "$env:APPDATA\Riyeser Team\update-check.txt" "kept"
          # Riyeser Documents was Riyeser Desk Assistant: install the released Desk Assistant first, so the new build is
          # checked as an update over it (same folder and program file, one Installed apps entry, data folder kept).
          $doc = Get-ChildItem "dist\RiyeserDocuments-Setup-*.exe" | Select-Object -First 1
          $dac = Get-ChildItem "dist\RiyeserDeskAssistant-Setup-*.exe" | Select-Object -First 1
          if (-not $doc -or -not $dac -or (Get-FileHash $doc.FullName).Hash -ne (Get-FileHash $dac.FullName).Hash) { throw "Expected RiyeserDocuments-Setup and the same file as RiyeserDeskAssistant-Setup in dist" }
          $oldDa = "$env:RUNNER_TEMP\RiyeserDeskAssistant-old.exe"
          Invoke-WebRequest "https://github.com/raka1987/Riyeser/releases/latest/download/RiyeserDeskAssistant-Setup.exe" -OutFile $oldDa
          Start-Process -FilePath $oldDa -ArgumentList "/S" -Wait
          Get-Process -Name "Riyeser Desk Assistant" -ErrorAction SilentlyContinue | Stop-Process -Force
          $oldDaEntry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -like "Riyeser Desk Assistant*" -or $_.DisplayName -like "Riyeser Documents*" }
          if (-not $oldDaEntry) { throw "The released Riyeser Desk Assistant didn't install" }
          Write-Host "Released copy installed first:" $oldDaEntry.DisplayName
          $oldDaExe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Desk Assistant.exe" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\Desk Assistant\data" | Out-Null
          Set-Content "$env:APPDATA\Desk Assistant\data\kept.txt" "kept"
          foreach ($app in @(
              @{ setup = "dist\RiyeserDocuments-Setup-*.exe"; exe = "Riyeser Desk Assistant.exe"; name = "Riyeser Documents*" },
              @{ setup = "dist-pdf\RiyeserPDF-Setup-*.exe"; exe = "Riyeser PDF.exe"; name = "Riyeser PDF*" },
              @{ setup = "dist-central\RiyeserCentral-Setup-*.exe"; exe = "Riyeser Central.exe"; name = "Riyeser Central*" },
              @{ setup = "dist-services\RiyeserServices-Setup-*.exe"; exe = "Riyeser Services.exe"; name = "As Built*" },
              @{ setup = "dist-team\RiyeserLink-Setup-*.exe"; exe = "Riyeser Team.exe"; name = "Riyeser Link [0-9]*" })) {
            $setup = Get-ChildItem $app.setup | Select-Object -First 1
            Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter $app.exe | Select-Object -First 1
            if (-not $exe) { throw "Installed app not found: $($app.exe)" }
            Write-Host "Installed:" $exe.FullName
            $entry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like $app.name
            if (-not $entry) { throw "Not listed in Installed apps: $($app.name)" }
            Write-Host "Listed as:" $entry.DisplayName "by" $entry.Publisher
          }
          # The update over the released Riyeser Team: one entry (now Riyeser Link), same program file, data kept
          $teamEntries = @(Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -like "Riyeser Team*" -or $_.DisplayName -like "Riyeser Link [0-9]*" })
          if ($teamEntries.Count -ne 1 -or $teamEntries[0].DisplayName -notlike "Riyeser Link 1.1*") { throw "Expected one Installed apps entry, Riyeser Link 1.1, found: $($teamEntries.DisplayName)" }
          $newExe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Team.exe" | Select-Object -First 1).FullName
          if ($newExe -ne $oldExe) { throw "Riyeser Link moved: was $oldExe, now $newExe" }
          if ((Get-Content "$env:APPDATA\Riyeser Team\update-check.txt" -Raw).Trim() -ne "kept") { throw "The Riyeser Team data folder wasn't kept" }
          $desk = [Environment]::GetFolderPath("Desktop")
          if (-not (Test-Path "$desk\Riyeser Link.lnk")) { throw "No Riyeser Link desktop shortcut after the update" }
          if (Test-Path "$desk\Riyeser Team.lnk") { Write-Warning "The old Riyeser Team desktop shortcut is still there" }
          Write-Host "Updated in place:" $teamEntries[0].DisplayName "at" $newExe
          # The update over the released Desk Assistant: one entry (now Riyeser Documents 1.x), same program file, data kept
          $docEntries = @(Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -like "Riyeser Desk Assistant*" -or $_.DisplayName -like "Riyeser Documents*" })
          if ($docEntries.Count -ne 1 -or $docEntries[0].DisplayName -notlike "Riyeser Documents 1.*") { throw "Expected one Installed apps entry, Riyeser Documents 1.x, found: $($docEntries.DisplayName)" }
          $docExe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Desk Assistant.exe" | Select-Object -First 1).FullName
          if ($docExe -ne $oldDaExe) { throw "Riyeser Documents moved: was $oldDaExe, now $docExe" }
          if ((Get-Content "$env:APPDATA\Desk Assistant\data\kept.txt" -Raw).Trim() -ne "kept") { throw "The Desk Assistant data folder wasn't kept" }
          if (-not (Test-Path "$desk\Riyeser Documents.lnk")) { throw "No Riyeser Documents desktop shortcut after the update" }
          if (Test-Path "$desk\Riyeser Desk Assistant.lnk") { Write-Warning "The old Riyeser Desk Assistant desktop shortcut is still there" }
          Write-Host "Updated in place:" $docEntries[0].DisplayName "at" $docExe
          # Riyeser Documents' own check: makes a library, adds a bank statement, it's suggested for Accounts > Bank statements
          # and filed there; the scanner script (Windows' WIA scan window) is valid PowerShell
          $dreport = "$env:RUNNER_TEMP\documents.json"
          Start-Process -FilePath $docExe -ArgumentList "--self-test=$dreport" -Wait
          $dr = Get-Content $dreport -Raw | ConvertFrom-Json
          $docVersion = [regex]::Match((Get-Content scripts\builder.config.js -Raw), "name: 'desk-assistant', version: '([^']+)'").Groups[1].Value
          if (-not ($dr.ok -and $dr.name -eq "Riyeser Documents" -and $dr.version -eq $docVersion)) { throw "Riyeser Documents' self-test failed: $($dr | ConvertTo-Json -Compress)" }
          $perr = $null; [System.Management.Automation.Language.Parser]::ParseFile($dr.scannerScriptPath, [ref]$null, [ref]$perr) | Out-Null
          if ($perr.Count) { throw "The scanner script doesn't parse: $($perr | Out-String)" }
          Write-Host "Riyeser Documents" $dr.version "files a document into" $dr.suggestion "and its scanner script parses"
          # Riyeser Link Office installs for the whole PC (Program Files, HKLM) and adds its Windows Firewall rule
          $lsetup = Get-ChildItem "dist-linkoffice\RiyeserLinkOffice-Setup-*.exe" | Select-Object -First 1
          Start-Process -FilePath $lsetup.FullName -ArgumentList "/S" -Wait
          $link = @("$env:ProgramFiles\Riyeser Link Office\Riyeser Link Office.exe", "$env:ProgramFiles\riyeser-linkoffice\Riyeser Link Office.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $link) { $link = (Get-ChildItem "$env:ProgramFiles" -Depth 2 -Filter "Riyeser Link Office.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          if (-not $link) { throw "Installed app not found: Riyeser Link Office.exe" }
          Write-Host "Installed:" $link
          $lentry = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Link Office*"
          if (-not $lentry) { throw "Not listed in Installed apps: Riyeser Link Office" }
          Write-Host "Listed as:" $lentry.DisplayName "by" $lentry.Publisher
          $rule = cmd /c 'netsh advfirewall firewall show rule name="Riyeser Link Office" verbose' | Out-String
          if ($LASTEXITCODE -ne 0 -or $rule -notmatch "5060" -or $rule -notmatch [regex]::Escape($link)) { throw "Riyeser Link Office's firewall rule is missing: $rule" }
          Write-Host "Firewall rule added for" $link
          $lreport = "$env:RUNNER_TEMP\link.json"
          Start-Process -FilePath $link -ArgumentList "--self-test=$lreport" -Wait
          $l = Get-Content $lreport -Raw | ConvertFrom-Json
          if (-not ($l.ok -and $l.sip -and $l.provisioning -and $l.name -eq "Riyeser Link Office")) { throw "Riyeser Link Office's self-test failed: $($l | ConvertTo-Json -Compress)" }
          Write-Host "Riyeser Link Office" $l.version "registers phones, connects a test call and sets up a desk phone"
          # Riyeser Central must find the other programs it opens
          $central = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Central.exe" | Select-Object -First 1
          $report = "$env:RUNNER_TEMP\central.json"
          Start-Process -FilePath $central.FullName -ArgumentList "--self-test=$report" -Wait
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $r.programs | Format-Table id, status, where -AutoSize | Out-String | Write-Host
          foreach ($id in @("desk", "pdf", "services", "team", "linkoffice")) { if (($r.programs | Where-Object id -eq $id).status -ne "installed") { throw "Riyeser Central can't find $id" } }
          Write-Host "Riyeser Central" $r.version "finds Documents, PDF, As Built, Riyeser Link and Riyeser Link Office"
          # As Built must carry its own copy of the app (works with no internet)
          $svc = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Services.exe" | Select-Object -First 1
          $sreport = "$env:RUNNER_TEMP\services.json"
          Start-Process -FilePath $svc.FullName -ArgumentList "--self-test=$sreport" -Wait
          $s = Get-Content $sreport -Raw | ConvertFrom-Json
          if (-not ($s.bundled -and $s.appPage -and $s.start)) { throw "As Built is missing its offline copy: $($s | ConvertTo-Json -Compress)" }
          Write-Host "As Built" $s.version "works offline (app files inside the program)"
          # Riyeser Link starts, and sets itself to start with Windows (so calls can ring); its data stays in the Riyeser Team folder
          $team = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Team.exe" | Select-Object -First 1
          $treport = "$env:RUNNER_TEMP\team.json"
          Start-Process -FilePath $team.FullName -ArgumentList "--hidden", "--self-test=$treport" -Wait
          $t = Get-Content $treport -Raw | ConvertFrom-Json
          if (-not ($t.ok -and $t.loginItem -and $t.name -eq "Riyeser Link" -and $t.version -eq [regex]::Match((Get-Content scripts\builder.config.js -Raw), "name: 'riyeser-team', version: '([^']+)'").Groups[1].Value -and $t.url -eq "https://riyeser.com/link/")) { throw "Riyeser Link didn't start properly: $($t | ConvertTo-Json -Compress)" }
          if ($t.userData -ne "$env:APPDATA\Riyeser Team" -or $t.sessionData -ne "$env:APPDATA\Riyeser Team") { throw "Riyeser Link must keep its sign-in in the Riyeser Team folder: $($t | ConvertTo-Json -Compress)" }
          Write-Host "Riyeser Link" $t.version "starts, starts with Windows, and keeps its data in" $t.userData
          # Uninstalling Riyeser Link Office removes its firewall rule
          $un = Get-ChildItem (Split-Path $link) -Filter "Uninstall*.exe" | Select-Object -First 1
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait
          $gone = $false
          for ($i = 0; $i -lt 60 -and -not $gone; $i++) { Start-Sleep -Seconds 2; cmd /c 'netsh advfirewall firewall show rule name="Riyeser Link Office"' | Out-Null; $gone = ($LASTEXITCODE -ne 0) }
          if (-not $gone) { throw "Riyeser Link Office's firewall rule is still there after uninstalling" }
          Write-Host "Uninstalling Riyeser Link Office removed its firewall rule"
          $global:LASTEXITCODE = 0
          $leftover = Get-ChildItem "$env:LOCALAPPDATA\Programs\desk-assistant\resources" -Directory | Where-Object Name -in @("python", "accounting")
          if ($leftover) { throw "Accounting files are still bundled" }

      - uses: actions/upload-artifact@v4
        with:
          name: Riyeser-Windows-installers
          path: |
            desktop/dist/RiyeserDocuments-Setup-*.exe
            desktop/dist/RiyeserDeskAssistant-Setup-*.exe
            desktop/dist-pdf/RiyeserPDF-Setup-*.exe
            desktop/dist-central/RiyeserCentral-Setup-*.exe
            desktop/dist-services/RiyeserServices-Setup-*.exe
            desktop/dist-team/RiyeserLink-Setup-*.exe
            desktop/dist-linkoffice/RiyeserLinkOffice-Setup-*.exe
          if-no-files-found: error

  # Riyeser Central's Install button, on a real Windows PC: every program from the latest release, installed with the
  # same silent options Central uses, then read back from Windows' installed-apps list the way Central reads it.
  # 1) as a standard Windows user (most office PCs: no administrator token), the way Central 1.8.10 started installers
  # 2) the same user with Central's new install-run.js (Link Office through the Windows permission prompt)
  # 3) as an administrator with install-run.js: every program installs and Central finds it
  central-install:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'central-install'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Unit tests (install state machine and detection)
        run: node --test test/central-install.test.js
      - name: Windows permission settings on this runner
        shell: pwsh
        run: |
          Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System | Select-Object EnableLUA, ConsentPromptBehaviorAdmin, ConsentPromptBehaviorUser, PromptOnSecureDesktop | Format-List | Out-String | Write-Host
          whoami /groups | Select-String -Pattern "Administrators|Mandatory Label" | Write-Host
      - name: Download the latest release's installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\riy\dl, C:\riy\out | Out-Null
          gh release download --repo raka1987/Riyeser --dir C:\riy\dl --pattern "Riyeser*-Setup.exe" --clobber
          Get-ChildItem C:\riy\dl | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          New-Item -ItemType Directory -Force C:\riy\app | Out-Null
          Copy-Item -Recurse src, scripts C:\riy\app\ -Force
          icacls C:\riy /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
      # The owner's PC: an administrator account with UAC on, so Central (like every normal program) runs with the
      # limited "standard user" token until Windows asks for permission. runas /trustlevel:0x20000 starts the check with
      # exactly that token here (this runner itself runs elevated, and allows elevation without a prompt).
      - name: Limited token (UAC, like the owner's PC), the way Central 1.8.10 installs (reproduces the bug)
        shell: pwsh
        run: |
          function As-Limited($mode, $extra, $name, $minutes) {
            $node = (Get-Command node).Source
            "@`"$node`" C:\riy\app\scripts\central-install-check.js --mode=$mode --dir=C:\riy\dl --out=C:\riy\out\$name.json $extra > C:\riy\out\$name.log 2>&1" | Set-Content "C:\riy\$name.cmd" -Encoding ascii
            runas /trustlevel:0x20000 "C:\riy\$name.cmd"
            for ($i = 0; $i -lt ($minutes * 12) -and -not (Test-Path "C:\riy\out\$name.json"); $i++) { Start-Sleep -Seconds 5 }
            Get-Content "C:\riy\out\$name.log" -ErrorAction SilentlyContinue | Write-Host
            if (-not (Test-Path "C:\riy\out\$name.json")) { throw "The check didn't finish with the limited token" }
          }
          As-Limited old "" "limited-old" 25
          $r = Get-Content C:\riy\out\limited-old.json -Raw | ConvertFrom-Json
          Write-Host "Ran with administrator rights:" $r.admin
          Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Link Office*" | ForEach-Object { Write-Host "Link Office got installed: $($_.DisplayName)" }
      - name: Link Office in detail (what its installer does after it returns)
        shell: pwsh
        run: |
          function Remove-LinkOffice {
            $e = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | Where-Object DisplayName -like "Riyeser Link Office*"
            if ($e) { Write-Host "Uninstalling" $e.DisplayName; Start-Process cmd.exe -ArgumentList "/c $($e.QuietUninstallString)" -Wait; Start-Sleep -Seconds 5 }
          }
          function As-Limited($mode, $name) {
            $node = (Get-Command node).Source
            "@`"$node`" C:\riy\app\scripts\central-install-check.js --mode=$mode --only=linkoffice --wait=150 --dir=C:\riy\dl --out=C:\riy\out\$name.json > C:\riy\out\$name.log 2>&1" | Set-Content "C:\riy\$name.cmd" -Encoding ascii
            runas /trustlevel:0x20000 "C:\riy\$name.cmd"
            for ($i = 0; $i -lt 100 -and -not (Test-Path "C:\riy\out\$name.json"); $i++) { Start-Sleep -Seconds 5 }
            Get-Content "C:\riy\out\$name.log" -ErrorAction SilentlyContinue | Write-Host
          }
          Remove-LinkOffice
          Write-Host "--- limited token, started directly (Central 1.8.10)"
          As-Limited old "lo-limited-old"
          Remove-LinkOffice
          Write-Host "--- administrator, started directly (Central 1.8.10)"
          node scripts/central-install-check.js --mode=old --only=linkoffice --wait=150 --dir=C:\riy\dl --out=C:\riy\out\lo-admin-old.json
          Remove-LinkOffice
          # From the limited token, Central now asks Windows for permission (Start-Process -Verb RunAs). On a PC that is the
          # Windows permission prompt; this runner has nobody to answer it, so the check only confirms Central waits on
          # it (and doesn't report "installed" when nothing was). The administrator step below runs the same code to the end.
          Write-Host "--- limited token, through the permission prompt (new): waits for an answer"
          $node = (Get-Command node).Source
          "@`"$node`" C:\riy\app\scripts\central-install-check.js --mode=new --only=linkoffice --dir=C:\riy\dl --out=C:\riy\out\lo-limited-new.json > C:\riy\out\lo-limited-new.log 2>&1" | Set-Content "C:\riy\lo-limited-new.cmd" -Encoding ascii
          runas /trustlevel:0x20000 "C:\riy\lo-limited-new.cmd"
          Start-Sleep -Seconds 60
          $prompt = Get-Process -Name consent -ErrorAction SilentlyContinue
          Write-Host "After 60 s: report written:" (Test-Path C:\riy\out\lo-limited-new.json) "; Windows permission prompt (consent.exe) open:" ([bool]$prompt)
          Get-Process -Name consent, powershell, node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-LinkOffice
          $global:LASTEXITCODE = 0
      - name: Administrator, with Central's new install (every program)
        shell: pwsh
        run: |
          node scripts/central-install-check.js --mode=new --dir=C:\riy\dl --out=C:\riy\out\admin-new.json
          Get-Process -Name "Riyeser*", "As Built" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $r = Get-Content C:\riy\out\admin-new.json -Raw | ConvertFrom-Json
          $r.results | Format-Table id, asset, version, code, startError, elevated, detected, where -AutoSize | Out-String -Width 220 | Write-Host
          $bad = @($r.results | Where-Object { -not $_.failure.ok -or -not $_.detected })
          if ($bad.Count) { throw "Not installed or not found: $($bad.id -join ', ')" }
          $lo = $r.results | Where-Object id -eq linkoffice
          if (-not $lo.elevated -or $lo.where -ne "HKLM") { throw "Link Office should install through the permission prompt, for the whole PC: $($lo | ConvertTo-Json -Compress -Depth 4)" }
          Write-Host "Every program installed the way Central installs it, and is listed; Link Office through Start-Process -Verb RunAs, in HKLM"
      - name: The released Riyeser Central finds every program
        shell: pwsh
        run: |
          Start-Process -FilePath C:\riy\dl\RiyeserCentral-Setup.exe -ArgumentList "/S" -Wait
          Get-Process -Name "Riyeser*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $central = $null
          for ($i = 0; $i -lt 60 -and -not $central; $i++) { $central = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Central.exe" -ErrorAction SilentlyContinue | Select-Object -First 1; if (-not $central) { Start-Sleep -Seconds 2 } }
          if (-not $central) { throw "The released Riyeser Central didn't install" }
          Start-Process -FilePath $central.FullName -ArgumentList "--self-test=C:\riy\out\central.json" -Wait
          $c = Get-Content C:\riy\out\central.json -Raw | ConvertFrom-Json
          $c.programs | Format-Table id, status, where -AutoSize | Out-String -Width 220 | Write-Host
          Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Accounting*" | ForEach-Object { Write-Host "Listed:" $_.DisplayName }
          # Accounting Plus replaces Accounting Basics when it installs over it (Central then shows only Plus)
          $missing = @($c.programs | Where-Object { $_.status -ne "installed" -and -not ($_.id -eq "accounting-basics" -and ($c.programs | Where-Object id -eq "accounting").status -eq "installed") })
          if ($missing.Count) { throw "Riyeser Central doesn't find: $($missing.id -join ', ')" }
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem C:\riy\out\*.json -ErrorAction SilentlyContinue) {
            Write-Host "== $($f.Name)"
            $r = Get-Content $f.FullName -Raw | ConvertFrom-Json
            if ($r.results) { $r.results | ForEach-Object { "{0,-18} {1,-36} code={2} startError={3} elevated={4} detected={5} where={6} reason={7} {8}" -f $_.id, $_.asset, $_.code, $_.startError, $_.elevated, $_.detected, $_.where, $_.failure.reason, $_.detail } | Write-Host }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: central-install-reports
          path: C:\riy\out\

  # 3) Riyeser Link Office 1.2.0 on a real network adapter: a test address is added, then swapped for another (like a
  #    router giving the PC a new address); Link Office must follow it by itself, move SIP, the desk phones' settings and
  #    riyeser-office.local, ask the phone to restart, and tell the website. Only when asked (job: link-ip, or all).
  link-ip:
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'link-ip' || inputs.job == 'all')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Link Office follows a new address
        run: node scripts/link-ip-check.js "$env:RUNNER_TEMP\link-ip.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-ip
          path: ${{ runner.temp }}/link-ip.json
