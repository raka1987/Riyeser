name: Riyeser Central + Documents + PDF + As Built + Link + Link Office (Windows)

# Builds the Windows installers for Riyeser Central, Riyeser Documents (formerly Desk Assistant), Riyeser PDF and the rest,
# installs them on a clean Windows machine and checks they are registered.
# When it runs (Windows minutes count twice on a private repository, so not on every push to every branch):
#   - by hand: Actions → this workflow → Run workflow (pick one job, or all)
#   - a push to module/desk-assistant, or a pull request into it, that changes desktop/ (or this file)
#   - before a release: another workflow can call it (workflow_call), e.g. a check before "Publish Riyeser release"
# A newer push to the same branch or pull request stops the older run.
on:
  push:
    branches: [module/desk-assistant]
    paths: ["desktop/**", ".github/workflows/desk-assistant-windows.yml"]
  pull_request:
    branches: [module/desk-assistant]
    paths: ["desktop/**", ".github/workflows/desk-assistant-windows.yml"]
  workflow_dispatch:
    inputs:
      job:
        description: "all, windows (build and check the installers), central-install (installs every program from the latest release the way Central does), link-ip (Link Office follows a new address on a real adapter) relay (the Riyeser relay as a Windows service, two sites calling through it) or update-all (an older released Central presses Update all)"
        default: all
      scenarios:
        description: "update-all only: JSON list of plain, apps-open, limited, av-delete, av-lock"
        default: '["plain"]'
      from_tag:
        description: "update-all only: the release whose Central and Accounting family are installed first (then Central's Update all takes them to the latest release)"
        default: riyeser-2026.11.28-64
  workflow_call:
    inputs:
      job:
        description: "all, windows, central-install, link-ip or relay (as above)"
        type: string
        default: all

concurrency: { group: "desk-windows-${{ github.event.pull_request.number || github.ref }}", cancel-in-progress: true }

env:
  # Released installers come from the public downloads repository; the old code repository while that has none yet.
  DOWNLOADS_REPO: raka1987/riyeser-downloads
  OLD_REPO: raka1987/Riyeser

jobs:
  windows:
    if: (github.event_name != 'workflow_dispatch' && !inputs.job) || inputs.job == 'all' || inputs.job == 'windows'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        run: |
          npm ci
          python -m pip install --quiet pillow

      - name: Unit tests
        run: npm test

      - name: Licence public key (from Riyeser's licence function; none until licence signing is switched on)
        shell: bash
        run: |
          # A public key, so it's fine in logs. 404: the function isn't deployed yet, so this build accepts unsigned
          # licences as before. Anything else that isn't a good key stops the build rather than ship without one.
          url="https://goaugynxeatzqzifpoes.supabase.co/functions/v1/licence/public-key"
          code=000
          for i in 1 2 3 4; do
            code=$(curl -sS -o "$RUNNER_TEMP/licence-key.json" -w '%{http_code}' "$url") || code=000
            if [ "$code" != 000 ] && [ "${code:0:1}" != 5 ]; then break; fi
            sleep 10
          done
          if [ "$code" = 200 ]; then
            key=$(node -e "const k=String(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).public_key||'');if(Buffer.from(k,'base64').length!==32)process.exit(1);process.stdout.write(k)" "$RUNNER_TEMP/licence-key.json") || { echo "The licence function's public key isn't a valid Ed25519 key"; exit 1; }
            echo "RIYESER_LICENCE_PUBLIC_KEY=$key" >> "$GITHUB_ENV"
            echo "Licence public key built in: $key"
          elif [ "$code" = 404 ]; then
            echo "Licence signing isn't set up yet: building without a public key (unsigned licences still work)."
          else
            echo "Couldn't fetch the licence public key (HTTP $code). Try again."; exit 1
          fi
      - name: Build installers
        run: node scripts/package-win.js

      - name: Install silently and check both apps
        shell: pwsh
        run: |
          # Riyeser Link was called Riyeser Team. Install the released Riyeser Team first, so the new build is checked
          # as an update over it: same folder and program file, one Installed apps entry, sign-in folder kept.
          # M3: the installer is RiyeserLink-Setup now, with a RiyeserTeam-Setup copy for the old name
          $lk = Get-ChildItem "dist-team\RiyeserLink-Setup-*.exe" | Select-Object -First 1
          $tm = Get-ChildItem "dist-team\RiyeserTeam-Setup-*.exe" | Select-Object -First 1
          if (-not $lk -or -not $tm -or (Get-FileHash $lk.FullName).Hash -ne (Get-FileHash $tm.FullName).Hash) { throw "Expected RiyeserLink-Setup and the same file as RiyeserTeam-Setup in dist-team" }
          $old = "$env:RUNNER_TEMP\RiyeserTeam-old.exe"
          # The latest released file: the downloads repository's, or the old code repository's while that has none yet
          function Get-Released($file, $out) {
            foreach ($repo in @($env:DOWNLOADS_REPO, $env:OLD_REPO)) {
              try { Invoke-WebRequest "https://github.com/$repo/releases/latest/download/$file" -OutFile $out; Write-Host "Released $file from $repo"; return } catch { Write-Host "No $file in $repo yet ($($_.Exception.Message))" }
            }
            throw "Couldn't download the released $file"
          }
          Get-Released "RiyeserTeam-Setup.exe" $old
          Start-Process -FilePath $old -ArgumentList "/S" -Wait
          $oldEntry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -like "Riyeser Team*" -or $_.DisplayName -like "Riyeser Link [0-9]*" }
          if (-not $oldEntry) { throw "The released Riyeser Team didn't install" }
          Write-Host "Released copy installed first:" $oldEntry.DisplayName
          $oldExe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Team.exe" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\Riyeser Team" | Out-Null
          Set-Content "$env:APPDATA\Riyeser Team\update-check.txt" "kept"
          # Riyeser Documents was Riyeser Desk Assistant: install the released Desk Assistant first, so the new build is
          # checked as an update over it (same folder and program file, one Installed apps entry, data folder kept).
          $doc = Get-ChildItem "dist\RiyeserDocuments-Setup-*.exe" | Select-Object -First 1
          $dac = Get-ChildItem "dist\RiyeserDeskAssistant-Setup-*.exe" | Select-Object -First 1
          if (-not $doc -or -not $dac -or (Get-FileHash $doc.FullName).Hash -ne (Get-FileHash $dac.FullName).Hash) { throw "Expected RiyeserDocuments-Setup and the same file as RiyeserDeskAssistant-Setup in dist" }
          $oldDa = "$env:RUNNER_TEMP\RiyeserDeskAssistant-old.exe"
          Get-Released "RiyeserDeskAssistant-Setup.exe" $oldDa
          Start-Process -FilePath $oldDa -ArgumentList "/S" -Wait
          Get-Process -Name "Riyeser Desk Assistant" -ErrorAction SilentlyContinue | Stop-Process -Force
          $oldDaEntry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -like "Riyeser Desk Assistant*" -or $_.DisplayName -like "Riyeser Documents*" }
          if (-not $oldDaEntry) { throw "The released Riyeser Desk Assistant didn't install" }
          Write-Host "Released copy installed first:" $oldDaEntry.DisplayName
          $oldDaExe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Desk Assistant.exe" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\Desk Assistant\data" | Out-Null
          Set-Content "$env:APPDATA\Desk Assistant\data\kept.txt" "kept"
          foreach ($app in @(
              @{ setup = "dist\RiyeserDocuments-Setup-*.exe"; exe = "Riyeser Desk Assistant.exe"; name = "Riyeser Documents*" },
              @{ setup = "dist-pdf\RiyeserPDF-Setup-*.exe"; exe = "Riyeser PDF.exe"; name = "Riyeser PDF*" },
              @{ setup = "dist-central\RiyeserCentral-Setup-*.exe"; exe = "Riyeser Central.exe"; name = "Riyeser Central*" },
              @{ setup = "dist-services\RiyeserServices-Setup-*.exe"; exe = "Riyeser Services.exe"; name = "As Built*" },
              @{ setup = "dist-team\RiyeserLink-Setup-*.exe"; exe = "Riyeser Team.exe"; name = "Riyeser Link [0-9]*" })) {
            $setup = Get-ChildItem $app.setup | Select-Object -First 1
            Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter $app.exe | Select-Object -First 1
            if (-not $exe) { throw "Installed app not found: $($app.exe)" }
            Write-Host "Installed:" $exe.FullName
            $entry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like $app.name
            if (-not $entry) { throw "Not listed in Installed apps: $($app.name)" }
            Write-Host "Listed as:" $entry.DisplayName "by" $entry.Publisher
            # The publisher was "Riyeser Group" before it became "Riyeser" (the released copies above still say so)
            if (@($entry.Publisher) -notcontains "Riyeser") { throw "$($app.name) should be listed by Riyeser, is: $($entry.Publisher)" }
          }
          # The update over the released Riyeser Team: one entry (now Riyeser Link), same program file, data kept
          $teamEntries = @(Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -like "Riyeser Team*" -or $_.DisplayName -like "Riyeser Link [0-9]*" })
          if ($teamEntries.Count -ne 1 -or $teamEntries[0].DisplayName -notlike "Riyeser Link 1.1*") { throw "Expected one Installed apps entry, Riyeser Link 1.1, found: $($teamEntries.DisplayName)" }
          $newExe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Team.exe" | Select-Object -First 1).FullName
          if ($newExe -ne $oldExe) { throw "Riyeser Link moved: was $oldExe, now $newExe" }
          if ((Get-Content "$env:APPDATA\Riyeser Team\update-check.txt" -Raw).Trim() -ne "kept") { throw "The Riyeser Team data folder wasn't kept" }
          $desk = [Environment]::GetFolderPath("Desktop")
          if (-not (Test-Path "$desk\Riyeser Link.lnk")) { throw "No Riyeser Link desktop shortcut after the update" }
          if (Test-Path "$desk\Riyeser Team.lnk") { Write-Warning "The old Riyeser Team desktop shortcut is still there" }
          Write-Host "Updated in place:" $teamEntries[0].DisplayName "at" $newExe
          # The update over the released Desk Assistant: one entry (now Riyeser Documents 1.x), same program file, data kept
          $docEntries = @(Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -like "Riyeser Desk Assistant*" -or $_.DisplayName -like "Riyeser Documents*" })
          if ($docEntries.Count -ne 1 -or $docEntries[0].DisplayName -notlike "Riyeser Documents 1.*") { throw "Expected one Installed apps entry, Riyeser Documents 1.x, found: $($docEntries.DisplayName)" }
          $docExe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Desk Assistant.exe" | Select-Object -First 1).FullName
          if ($docExe -ne $oldDaExe) { throw "Riyeser Documents moved: was $oldDaExe, now $docExe" }
          if ((Get-Content "$env:APPDATA\Desk Assistant\data\kept.txt" -Raw).Trim() -ne "kept") { throw "The Desk Assistant data folder wasn't kept" }
          if (-not (Test-Path "$desk\Riyeser Documents.lnk")) { throw "No Riyeser Documents desktop shortcut after the update" }
          if (Test-Path "$desk\Riyeser Desk Assistant.lnk") { Write-Warning "The old Riyeser Desk Assistant desktop shortcut is still there" }
          Write-Host "Updated in place:" $docEntries[0].DisplayName "at" $docExe
          # Riyeser Documents' own check: makes a library, adds a bank statement, it's suggested for Accounts > Bank statements
          # and filed there; the scanner script (Windows' WIA scan window) is valid PowerShell
          $dreport = "$env:RUNNER_TEMP\documents.json"
          Start-Process -FilePath $docExe -ArgumentList "--self-test=$dreport" -Wait
          $dr = Get-Content $dreport -Raw | ConvertFrom-Json
          $docVersion = [regex]::Match((Get-Content scripts\builder.config.js -Raw), "name: 'desk-assistant', version: '([^']+)'").Groups[1].Value
          if (-not ($dr.ok -and $dr.name -eq "Riyeser Documents" -and $dr.version -eq $docVersion)) { throw "Riyeser Documents' self-test failed: $($dr | ConvertTo-Json -Compress)" }
          $perr = $null; [System.Management.Automation.Language.Parser]::ParseFile($dr.scannerScriptPath, [ref]$null, [ref]$perr) | Out-Null
          if ($perr.Count) { throw "The scanner script doesn't parse: $($perr | Out-String)" }
          Write-Host "Riyeser Documents" $dr.version "files a document into" $dr.suggestion "and its scanner script parses"
          # Riyeser PDF 0.26: its installer adds the "Riyeser PDF" right-click menu for PDFs and pictures, for this Windows
          # user (HKCU, no administrator). Each entry must start the installed program with its task and the file.
          $pdfExe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser PDF.exe" | Select-Object -First 1).FullName
          $menuKeys = @(".pdf\shell\RiyeserPDF\shell\1open|open", ".pdf\shell\RiyeserPDF\shell\2sign|sign", ".pdf\shell\RiyeserPDF\shell\3compress|compress", ".pdf\shell\RiyeserPDF\shell\4combine|combine", ".pdf\shell\RiyeserPDF\shell\5toimages|toimages",
            ".jpg\shell\RiyeserPDF\shell\6topdf|topdf", ".jpeg\shell\RiyeserPDF\shell\4combine|combine", ".png\shell\RiyeserPDF\shell\6topdf|topdf")
          foreach ($mk in $menuKeys) {
            $k, $task = $mk.Split("|")
            $cmd = Get-ItemPropertyValue -Path "HKCU:\Software\Classes\SystemFileAssociations\$k\command" -Name "(default)" -ErrorAction SilentlyContinue
            if ($cmd -ne ('"' + $pdfExe + '" --task=' + $task + ' "%1"')) { throw "Riyeser PDF's right-click entry $k is missing or wrong: $cmd" }
          }
          if ((Get-ItemPropertyValue -Path "HKCU:\Software\Classes\SystemFileAssociations\.pdf\shell\RiyeserPDF" -Name "MUIVerb") -ne "Riyeser PDF") { throw "The right-click menu isn't called Riyeser PDF" }
          Write-Host "Riyeser PDF's right-click menu is there for this Windows user:" $menuKeys.Count "entries checked"
          # Riyeser PDF's own check: converters, a sealed signature, the right-click commands read back, start screen and Settings
          $pdir = "$env:RUNNER_TEMP\pdf-selftest"; New-Item -ItemType Directory -Force -Path $pdir | Out-Null
          Start-Process -FilePath $pdfExe -ArgumentList "--self-test=$pdir\pdf.json" -Wait
          $pr = Get-Content "$pdir\pdf.json" -Raw | ConvertFrom-Json
          $pdfVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $pr.checks | Format-List | Out-String | Write-Host
          if (-not ($pr.ok -and $pr.version -eq $pdfVersion -and $pr.signatureProtected -and $pr.ui.defaultButton)) { throw "Riyeser PDF's self-test failed: $($pr | ConvertTo-Json -Compress -Depth 5)" }
          Write-Host "Riyeser PDF" $pr.version "converts files, keeps signatures sealed, its right-click commands start it with the right task, and its start screen and Settings draw"
          # Riyeser Link Office installs for the whole PC (Program Files, HKLM) and adds its Windows Firewall rule
          $lsetup = Get-ChildItem "dist-linkoffice\RiyeserLinkOffice-Setup-*.exe" | Select-Object -First 1
          Start-Process -FilePath $lsetup.FullName -ArgumentList "/S" -Wait
          $link = @("$env:ProgramFiles\Riyeser Link Office\Riyeser Link Office.exe", "$env:ProgramFiles\riyeser-linkoffice\Riyeser Link Office.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $link) { $link = (Get-ChildItem "$env:ProgramFiles" -Depth 2 -Filter "Riyeser Link Office.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          if (-not $link) { throw "Installed app not found: Riyeser Link Office.exe" }
          Write-Host "Installed:" $link
          $lentry = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Link Office*"
          if (-not $lentry) { throw "Not listed in Installed apps: Riyeser Link Office" }
          Write-Host "Listed as:" $lentry.DisplayName "by" $lentry.Publisher
          if ($lentry.Publisher -ne "Riyeser") { throw "Riyeser Link Office should be listed by Riyeser, is: $($lentry.Publisher)" }
          $rule = cmd /c 'netsh advfirewall firewall show rule name="Riyeser Link Office" verbose' | Out-String
          if ($LASTEXITCODE -ne 0 -or $rule -notmatch "5060" -or $rule -notmatch [regex]::Escape($link)) { throw "Riyeser Link Office's firewall rule is missing: $rule" }
          Write-Host "Firewall rule added for" $link
          $lreport = "$env:RUNNER_TEMP\link.json"
          Start-Process -FilePath $link -ArgumentList "--self-test=$lreport" -Wait
          $l = Get-Content $lreport -Raw | ConvertFrom-Json
          if (-not ($l.ok -and $l.sip -and $l.provisioning -and $l.name -eq "Riyeser Link Office")) { throw "Riyeser Link Office's self-test failed: $($l | ConvertTo-Json -Compress)" }
          Write-Host "Riyeser Link Office" $l.version "registers phones, connects a test call and sets up a desk phone"
          # Riyeser Central must find the other programs it opens
          $central = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Central.exe" | Select-Object -First 1
          $report = "$env:RUNNER_TEMP\central.json"
          Start-Process -FilePath $central.FullName -ArgumentList "--self-test=$report" -Wait
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $r.programs | Format-Table id, status, where -AutoSize | Out-String | Write-Host
          foreach ($id in @("desk", "pdf", "services", "team", "linkoffice")) { if (($r.programs | Where-Object id -eq $id).status -ne "installed") { throw "Riyeser Central can't find $id" } }
          Write-Host "Riyeser Central" $r.version "finds Documents, PDF, As Built, Riyeser Link and Riyeser Link Office"
          # Central 1.9's home screen (the App launcher) draws a tile for each of them, with no page errors
          $ui = "$env:RUNNER_TEMP\central-ui.json"
          Start-Process -FilePath $central.FullName -ArgumentList "--self-test-ui=$ui" -Wait
          $u = Get-Content $ui -Raw | ConvertFrom-Json
          $u.tiles | Format-Table name, line -AutoSize | Out-String | Write-Host
          foreach ($n in @("Documents", "PDF", "As Built", "Link", "Link Office", "Add a program")) { if (-not ($u.tiles | Where-Object name -eq $n)) { throw "Riyeser Central's home screen has no $n tile" } }
          if ($u.errors.Count) { throw "Riyeser Central's home screen had errors: $($u.errors -join ' | ')" }
          if ($u.hscroll) { throw "Riyeser Central's home screen scrolls sideways" }
          Copy-Item "$env:RUNNER_TEMP\central-ui.png" dist-central\ -ErrorAction SilentlyContinue
          Write-Host "Riyeser Central" $u.version "home screen:" $u.tiles.Count "tiles, pill:" $u.pill
          # As Built must carry its own copy of the app (works with no internet)
          $svc = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Services.exe" | Select-Object -First 1
          $sreport = "$env:RUNNER_TEMP\services.json"
          Start-Process -FilePath $svc.FullName -ArgumentList "--self-test=$sreport" -Wait
          $s = Get-Content $sreport -Raw | ConvertFrom-Json
          if (-not ($s.bundled -and $s.appPage -and $s.start)) { throw "As Built is missing its offline copy: $($s | ConvertTo-Json -Compress)" }
          Write-Host "As Built" $s.version "works offline (app files inside the program)"
          # Riyeser Link starts, and sets itself to start with Windows (so calls can ring); its data stays in the Riyeser Team folder
          $team = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Team.exe" | Select-Object -First 1
          $treport = "$env:RUNNER_TEMP\team.json"
          Start-Process -FilePath $team.FullName -ArgumentList "--hidden", "--self-test=$treport" -Wait
          $t = Get-Content $treport -Raw | ConvertFrom-Json
          if (-not ($t.ok -and $t.loginItem -and $t.name -eq "Riyeser Link" -and $t.version -eq [regex]::Match((Get-Content scripts\builder.config.js -Raw), "name: 'riyeser-team', version: '([^']+)'").Groups[1].Value -and $t.url -eq "https://riyeser.com/link/")) { throw "Riyeser Link didn't start properly: $($t | ConvertTo-Json -Compress)" }
          if ($t.userData -ne "$env:APPDATA\Riyeser Team" -or $t.sessionData -ne "$env:APPDATA\Riyeser Team") { throw "Riyeser Link must keep its sign-in in the Riyeser Team folder: $($t | ConvertTo-Json -Compress)" }
          Write-Host "Riyeser Link" $t.version "starts, starts with Windows, and keeps its data in" $t.userData
          # Uninstalling Riyeser Link Office removes its firewall rule
          $un = Get-ChildItem (Split-Path $link) -Filter "Uninstall*.exe" | Select-Object -First 1
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait
          $gone = $false
          for ($i = 0; $i -lt 60 -and -not $gone; $i++) { Start-Sleep -Seconds 2; cmd /c 'netsh advfirewall firewall show rule name="Riyeser Link Office"' | Out-Null; $gone = ($LASTEXITCODE -ne 0) }
          if (-not $gone) { throw "Riyeser Link Office's firewall rule is still there after uninstalling" }
          Write-Host "Uninstalling Riyeser Link Office removed its firewall rule"
          # Uninstalling Riyeser PDF removes its right-click menu (and nothing is left under this user's classes)
          $pun = Get-ChildItem (Split-Path $pdfExe) -Filter "Uninstall*.exe" | Select-Object -First 1
          Start-Process -FilePath $pun.FullName -ArgumentList "/S" -Wait
          $gone = $false
          for ($i = 0; $i -lt 60 -and -not $gone; $i++) {
            Start-Sleep -Seconds 2
            $gone = -not (@(".pdf", ".jpg", ".jpeg", ".png") | Where-Object { Test-Path "HKCU:\Software\Classes\SystemFileAssociations\$_\shell\RiyeserPDF" })
          }
          if (-not $gone) { throw "Riyeser PDF's right-click menu is still there after uninstalling" }
          Write-Host "Uninstalling Riyeser PDF removed its right-click menu"
          $global:LASTEXITCODE = 0
          $leftover = Get-ChildItem "$env:LOCALAPPDATA\Programs\desk-assistant\resources" -Directory | Where-Object Name -in @("python", "accounting")
          if ($leftover) { throw "Accounting files are still bundled" }

      - name: The free trial survives reinstalling (the registry key is kept on uninstall; installs are counted)
        shell: pwsh
        run: |
          # Central's installer counted its install in HKCU\Software\Riyeser\Trial
          $key = "HKCU:\Software\Riyeser\Trial"
          $n1 = (Get-ItemProperty $key -ErrorAction SilentlyContinue).Installs
          if (-not $n1 -or $n1 -lt 1) { throw "Central's installer didn't count its install (Installs = $n1)" }
          # the trial, as Central's licence code keeps it (licence.json, markers, the registry)
          $out = node scripts/trial-guard-check.js start; if ($LASTEXITCODE -ne 0) { throw "trial-guard-check start failed: $out" }
          $start = ($out | Select-String '^TRIAL_START=(.+)$').Matches[0].Groups[1].Value
          Write-Host "Trial start:" $start "· installs:" $n1
          # uninstall Central (quietly, as Installed apps does)
          Get-Process -Name "Riyeser Central" -ErrorAction SilentlyContinue | Stop-Process -Force
          $e = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Central*" | Select-Object -First 1
          if (-not $e) { throw "Riyeser Central isn't in Installed apps" }
          $u = if ($e.QuietUninstallString) { $e.QuietUninstallString } else { "$($e.UninstallString) /S" }
          Start-Process cmd.exe -ArgumentList "/c $u" -Wait
          for ($i = 0; $i -lt 30 -and (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Central*"); $i++) { Start-Sleep -Seconds 2 }
          if (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Central*") { throw "Riyeser Central didn't uninstall" }
          if (-not (Test-Path $key)) { throw "Uninstalling removed HKCU\Software\Riyeser\Trial" }
          if ([DateTime]::Parse((Get-ItemProperty $key).suite).ToUniversalTime() -ne [DateTime]::Parse($start).ToUniversalTime()) { throw "The registry's trial date changed on uninstall" }
          Write-Host "After uninstalling, the registry still has the trial date:" (Get-ItemProperty $key).suite
          # the data folders wiped too (the worst case), then Central installed again
          Remove-Item -Recurse -Force "$env:APPDATA\Riyeser", "$env:APPDATA\Riyeser Central" -ErrorAction SilentlyContinue
          $setup = Get-ChildItem "dist-central\RiyeserCentral-Setup-*.exe" | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          Get-Process -Name "Riyeser Central" -ErrorAction SilentlyContinue | Stop-Process -Force
          $n2 = (Get-ItemProperty $key).Installs
          if ($n2 -ne $n1 + 1) { throw "The reinstall wasn't counted (was $n1, now $n2)" }
          $out = node scripts/trial-guard-check.js check $start; if ($LASTEXITCODE -ne 0) { throw "The trial restarted after reinstalling: $out" }
          Write-Host "Reinstalled with wiped data folders: same trial start ($start), installs $n2"

      - uses: actions/upload-artifact@v4
        with:
          name: Riyeser-Windows-installers
          path: |
            desktop/dist/RiyeserDocuments-Setup-*.exe
            desktop/dist/RiyeserDeskAssistant-Setup-*.exe
            desktop/dist-pdf/RiyeserPDF-Setup-*.exe
            desktop/dist-central/RiyeserCentral-Setup-*.exe
            desktop/dist-services/RiyeserServices-Setup-*.exe
            desktop/dist-team/RiyeserLink-Setup-*.exe
            desktop/dist-linkoffice/RiyeserLinkOffice-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: central-home-screen
          path: desktop/dist-central/central-ui.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-self-test
          path: ${{ runner.temp }}/pdf-selftest/
          if-no-files-found: ignore

  # Riyeser Central's Install button, on a real Windows PC: every program from the latest release, installed with the
  # same silent options Central uses, then read back from Windows' installed-apps list the way Central reads it.
  # 1) as a standard Windows user (most office PCs: no administrator token), the way Central 1.8.10 started installers
  # 2) the same user with Central's new install-run.js (Link Office through the Windows permission prompt)
  # 3) as an administrator with install-run.js: every program installs and Central finds it
  central-install:
    if: (github.event_name != 'workflow_dispatch' && !inputs.job) || inputs.job == 'all' || inputs.job == 'central-install'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Unit tests (install state machine and detection, first run's install queue)
        run: node --test test/central-install.test.js test/central-first-run.test.js test/central-update-run.test.js
      - name: Windows permission settings on this runner
        shell: pwsh
        run: |
          Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System | Select-Object EnableLUA, ConsentPromptBehaviorAdmin, ConsentPromptBehaviorUser, PromptOnSecureDesktop | Format-List | Out-String | Write-Host
          whoami /groups | Select-String -Pattern "Administrators|Mandatory Label" | Write-Host
      - name: Download the latest release's installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\riy\dl, C:\riy\out | Out-Null
          # The downloads repository's latest release; the old code repository's while that has none yet
          gh release download --repo $env:DOWNLOADS_REPO --dir C:\riy\dl --pattern "Riyeser*-Setup.exe" --clobber
          if ($LASTEXITCODE -ne 0 -or -not (Get-ChildItem C:\riy\dl -Filter "Riyeser*-Setup.exe")) {
            Write-Host "No release in $env:DOWNLOADS_REPO yet: using $env:OLD_REPO"
            gh release download --repo $env:OLD_REPO --dir C:\riy\dl --pattern "Riyeser*-Setup.exe" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Couldn't download the latest release's installers" }
          }
          Get-ChildItem C:\riy\dl | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          New-Item -ItemType Directory -Force C:\riy\app | Out-Null
          Copy-Item -Recurse src, scripts C:\riy\app\ -Force
          icacls C:\riy /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
      # The owner's PC: an administrator account with UAC on, so Central (like every normal program) runs with the
      # limited "standard user" token until Windows asks for permission. runas /trustlevel:0x20000 starts the check with
      # exactly that token here (this runner itself runs elevated, and allows elevation without a prompt).
      - name: Limited token (UAC, like the owner's PC), the way Central 1.8.10 installs (reproduces the bug)
        shell: pwsh
        run: |
          function As-Limited($mode, $extra, $name, $minutes) {
            $node = (Get-Command node).Source
            "@`"$node`" C:\riy\app\scripts\central-install-check.js --mode=$mode --dir=C:\riy\dl --out=C:\riy\out\$name.json $extra > C:\riy\out\$name.log 2>&1" | Set-Content "C:\riy\$name.cmd" -Encoding ascii
            runas /trustlevel:0x20000 "C:\riy\$name.cmd"
            for ($i = 0; $i -lt ($minutes * 12) -and -not (Test-Path "C:\riy\out\$name.json"); $i++) { Start-Sleep -Seconds 5 }
            Get-Content "C:\riy\out\$name.log" -ErrorAction SilentlyContinue | Write-Host
            if (-not (Test-Path "C:\riy\out\$name.json")) { throw "The check didn't finish with the limited token" }
          }
          As-Limited old "" "limited-old" 25
          $r = Get-Content C:\riy\out\limited-old.json -Raw | ConvertFrom-Json
          Write-Host "Ran with administrator rights:" $r.admin
          Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Link Office*" | ForEach-Object { Write-Host "Link Office got installed: $($_.DisplayName)" }
      - name: Link Office in detail (what its installer does after it returns)
        shell: pwsh
        run: |
          function Remove-LinkOffice {
            $e = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | Where-Object DisplayName -like "Riyeser Link Office*"
            if ($e) { Write-Host "Uninstalling" $e.DisplayName; Start-Process cmd.exe -ArgumentList "/c $($e.QuietUninstallString)" -Wait; Start-Sleep -Seconds 5 }
          }
          function As-Limited($mode, $name) {
            $node = (Get-Command node).Source
            "@`"$node`" C:\riy\app\scripts\central-install-check.js --mode=$mode --only=linkoffice --wait=150 --dir=C:\riy\dl --out=C:\riy\out\$name.json > C:\riy\out\$name.log 2>&1" | Set-Content "C:\riy\$name.cmd" -Encoding ascii
            runas /trustlevel:0x20000 "C:\riy\$name.cmd"
            for ($i = 0; $i -lt 100 -and -not (Test-Path "C:\riy\out\$name.json"); $i++) { Start-Sleep -Seconds 5 }
            Get-Content "C:\riy\out\$name.log" -ErrorAction SilentlyContinue | Write-Host
          }
          Remove-LinkOffice
          Write-Host "--- limited token, started directly (Central 1.8.10)"
          As-Limited old "lo-limited-old"
          Remove-LinkOffice
          Write-Host "--- administrator, started directly (Central 1.8.10)"
          node scripts/central-install-check.js --mode=old --only=linkoffice --wait=150 --dir=C:\riy\dl --out=C:\riy\out\lo-admin-old.json
          Remove-LinkOffice
          # From the limited token, Central now asks Windows for permission (Start-Process -Verb RunAs). On a PC that is the
          # Windows permission prompt; this runner has nobody to answer it, so the check only confirms Central waits on
          # it (and doesn't report "installed" when nothing was). The administrator step below runs the same code to the end.
          Write-Host "--- limited token, through the permission prompt (new): waits for an answer"
          $node = (Get-Command node).Source
          "@`"$node`" C:\riy\app\scripts\central-install-check.js --mode=new --only=linkoffice --dir=C:\riy\dl --out=C:\riy\out\lo-limited-new.json > C:\riy\out\lo-limited-new.log 2>&1" | Set-Content "C:\riy\lo-limited-new.cmd" -Encoding ascii
          runas /trustlevel:0x20000 "C:\riy\lo-limited-new.cmd"
          Start-Sleep -Seconds 60
          $prompt = Get-Process -Name consent -ErrorAction SilentlyContinue
          Write-Host "After 60 s: report written:" (Test-Path C:\riy\out\lo-limited-new.json) "; Windows permission prompt (consent.exe) open:" ([bool]$prompt)
          Get-Process -Name consent, powershell, node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-LinkOffice
          $global:LASTEXITCODE = 0
      # Central's first run ("One installer"): a business's plan (Accounting Plus, Payroll, POS, Riyeser Link) installs one
      # program after another from the release with central/first-run.js; the network drops after two programs, the rest
      # pause and carry on when it's back; the whole-PC programs (Link Office, plus PDF here to make it two) install
      # together through ONE permission prompt; then a second PC of the business set up as the Till skips what's there.
      - name: First run, "One installer" (a business's plan end to end, network drop and resume, one permission prompt, a till PC)
        shell: pwsh
        run: |
          $names = "Riyeser Documents*", "Riyeser Desk Assistant*", "Riyeser PDF*", "Riyeser Accounting Plus*", "Riyeser Link*", "Riyeser Team*", "Riyeser Payroll*", "Riyeser POS*"
          foreach ($root in "HKCU:", "HKLM:") {
            Get-ItemProperty "$root\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $d = $_.DisplayName; $d -and ($names | Where-Object { $d -like $_ }) } | ForEach-Object {
              $u = if ($_.QuietUninstallString) { $_.QuietUninstallString } else { "$($_.UninstallString) /S" }
              Write-Host "Removing $($_.DisplayName) first"; Start-Process cmd.exe -ArgumentList "/c $u" -Wait -WindowStyle Hidden
            }
          }
          Start-Sleep -Seconds 20
          Get-Process -Name "Riyeser*", "Un_A", "Au_" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          node scripts/central-firstrun-check.js --plan=plus,payroll,pos,calls --offline-after=2 --batch-extra=pdf --dir=C:\riy\dl --out=C:\riy\out\firstrun.json
          $code = $LASTEXITCODE
          Get-Process -Name "Riyeser*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($code) { throw "Central's first run didn't install the plan end to end (see firstrun.json)" }
      - name: Administrator, with Central's new install (every program)
        shell: pwsh
        run: |
          node scripts/central-install-check.js --mode=new --dir=C:\riy\dl --out=C:\riy\out\admin-new.json
          Get-Process -Name "Riyeser*", "As Built" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $r = Get-Content C:\riy\out\admin-new.json -Raw | ConvertFrom-Json
          $r.results | Format-Table id, asset, version, code, startError, elevated, detected, where -AutoSize | Out-String -Width 220 | Write-Host
          $bad = @($r.results | Where-Object { -not $_.failure.ok -or -not $_.detected })
          if ($bad.Count) { throw "Not installed or not found: $($bad.id -join ', ')" }
          $lo = $r.results | Where-Object id -eq linkoffice
          if (-not $lo.elevated -or $lo.where -ne "HKLM") { throw "Link Office should install through the permission prompt, for the whole PC: $($lo | ConvertTo-Json -Compress -Depth 4)" }
          Write-Host "Every program installed the way Central installs it, and is listed; Link Office through Start-Process -Verb RunAs, in HKLM"
      - name: Central 1.9's Uninstall finds each program's own uninstaller (a tile's ⋯ menu)
        shell: pwsh
        run: |
          # every program Windows lists (Accounting Plus replaces Accounting Basics when it installs over it)
          $hkcu = reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall" /s /reg:64 | Out-String
          $hklm = reg query "HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall" /s /reg:64 | Out-String
          Set-Content -Path C:\riy\out\uninstall-reg.txt -Value ($hkcu + "`n" + $hklm) -Encoding utf8
          # the publisher each released installer wrote ("Riyeser Group" before it became "Riyeser"): found either way
          Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*, HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "Riyeser*" -or $_.DisplayName -like "As Built*" } | Format-Table DisplayName, Publisher -AutoSize | Out-String -Width 160 | Write-Host
          node -e "const u = require('./src/central/updates'); const fs = require('fs'); const t = fs.readFileSync('C:/riy/out/uninstall-reg.txt', 'utf8'); const listed = Object.keys(u.installedFromRegistry(t)).filter((id) => id !== 'central'); const miss = []; for (const id of listed) { const f = u.uninstallFromRegistry(t, id); console.log(id.padEnd(18), f ? f.command : '(none)'); if (!f) miss.push(id); } if (listed.length < 11) { console.error('Only ' + listed.length + ' programs are listed: ' + listed.join(', ')); process.exit(1); } if (miss.length) { console.error('No uninstaller found for ' + miss.join(', ')); process.exit(1); }"
      - name: The released Riyeser Central finds every program
        shell: pwsh
        run: |
          Start-Process -FilePath C:\riy\dl\RiyeserCentral-Setup.exe -ArgumentList "/S" -Wait
          Get-Process -Name "Riyeser*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $central = $null
          for ($i = 0; $i -lt 60 -and -not $central; $i++) { $central = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Central.exe" -ErrorAction SilentlyContinue | Select-Object -First 1; if (-not $central) { Start-Sleep -Seconds 2 } }
          if (-not $central) { throw "The released Riyeser Central didn't install" }
          Start-Process -FilePath $central.FullName -ArgumentList "--self-test=C:\riy\out\central.json" -Wait
          $c = Get-Content C:\riy\out\central.json -Raw | ConvertFrom-Json
          $c.programs | Format-Table id, status, where -AutoSize | Out-String -Width 220 | Write-Host
          Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Accounting*" | ForEach-Object { Write-Host "Listed:" $_.DisplayName }
          # Accounting Plus replaces Accounting Basics when it installs over it (Central then shows only Plus)
          $missing = @($c.programs | Where-Object { $_.status -ne "installed" -and -not ($_.id -eq "accounting-basics" -and ($c.programs | Where-Object id -eq "accounting").status -eq "installed") })
          if ($missing.Count) { throw "Riyeser Central doesn't find: $($missing.id -join ', ')" }
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem C:\riy\out\*.json -ErrorAction SilentlyContinue) {
            Write-Host "== $($f.Name)"
            $r = Get-Content $f.FullName -Raw | ConvertFrom-Json
            if ($r.results) { $r.results | ForEach-Object { "{0,-18} {1,-36} code={2} startError={3} elevated={4} detected={5} where={6} reason={7} {8}" -f $_.id, $_.asset, $_.code, $_.startError, $_.elevated, $_.detected, $_.where, $_.failure.reason, $_.detail } | Write-Host }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: central-install-reports
          path: C:\riy\out\

  # 3) Riyeser Link Office 1.2.0 on a real network adapter: a test address is added, then swapped for another (like a
  #    router giving the PC a new address); Link Office must follow it by itself, move SIP, the desk phones' settings and
  #    riyeser-office.local, ask the phone to restart, and tell the website. Only when asked (job: link-ip, or all).
  link-ip:
    if: inputs.job == 'link-ip' || inputs.job == 'all'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: A test network adapter (Microsoft loopback, so the runner's own adapter is never touched)
        run: |
          choco install devcon.portable -y --no-progress | Out-Null
          $devcon = (Get-ChildItem "$env:ChocolateyInstall\lib\devcon.portable" -Recurse -Filter "devcon*64*.exe" | Select-Object -First 1).FullName
          if (-not $devcon) { $devcon = (Get-ChildItem "$env:ChocolateyInstall\lib\devcon.portable" -Recurse -Filter "devcon*.exe" | Select-Object -First 1).FullName }
          & $devcon install "$env:windir\inf\netloop.inf" "*MSLOOP"
          Start-Sleep -Seconds 5
          Get-NetAdapter | Format-Table Name, InterfaceDescription, Status -AutoSize
          $a = Get-NetAdapter | Where-Object InterfaceDescription -like "*Loopback*" | Select-Object -First 1
          if (-not $a) { throw "No loopback adapter" }
          Set-NetIPInterface -InterfaceAlias $a.Name -Dhcp Disabled
          Enable-NetAdapter -Name $a.Name -Confirm:$false
      - name: Link Office follows a new address
        run: |
          # bounded here too: whatever happens, the log is shown and the leftover helpers stopped
          $o = "$env:RUNNER_TEMP\link-ip"
          $p = Start-Process node -ArgumentList "scripts/link-ip-check.js", "$o.json" -NoNewWindow -PassThru -RedirectStandardOutput "$o.log" -RedirectStandardError "$o.err"
          if (-not $p.WaitForExit(480000)) { Write-Host "Still running after 8 minutes: stopping it"; Stop-Process -Id $p.Id -Force }
          Get-Content "$o.log", "$o.err" -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Where-Object CommandLine -like "*RiyeserNet*" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          if (-not (Test-Path "$o.json") -or -not (Get-Content "$o.json" -Raw | ConvertFrom-Json).ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-ip
          path: ${{ runner.temp }}/link-ip.*

  # 5. The Riyeser relay on Windows (Link Office 1.3.0): installed as a Windows service with its own installer
  #    (install-relay.ps1: a task at boot as SYSTEM, firewall rules, a self-signed certificate), then two Link Office
  #    sites (the real phone engine, each in its own process) connect to it over wss with the certificate pinned, call
  #    each other with sound both ways (RTP counted), the relay's task is restarted, and they reconnect and call again.
  #    The relay and site tests on this PC (link-relay.test.js: failover, relay down, isolation) run first.
  #    1.3.1: also the test call (tone through the relay's echo), the relay's ports tested from outside by a second relay,
  #    and "move the relay to a new PC": uninstalled the way Link Office does it (checked: no task, no firewall rules, the
  #    router port forwarding removed, no key or settings, logs zipped), installed again with a new id and key, and the
  #    same two sites reconnect to it by themselves and call again with sound both ways.
  relay:
    if: (github.event_name != 'workflow_dispatch' && !inputs.job) || inputs.job == 'all' || inputs.job == 'relay'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Relay and Link Office relay tests (this PC)
        run: node --test --test-timeout=120000 --test-force-exit test/link-relay.test.js test/link-relay-remove.test.js
      - name: Install the relay as a Windows service
        run: |
          $node = (Get-Command node).Source
          & ./src/relay/deploy/windows/install-relay.ps1 -Node $node -RelayDir (Resolve-Path src/relay).Path -Domain relay.riyeser.com -Region "Head office" -Id suva1 -NoPortMap -PublicIp 127.0.0.1 -SupabaseUrl ""
          if ($LASTEXITCODE) { Get-Content "$env:ProgramData\Riyeser Relay\logs\relay.log" -ErrorAction SilentlyContinue; exit 1 }
          Get-ScheduledTask -TaskName "Riyeser Relay" | Format-List TaskName, State
          Get-NetFirewallRule -DisplayName "Riyeser Relay*" | Format-Table DisplayName, Enabled, Direction -AutoSize
      - name: Two sites call each other through it (sound both ways), test call, ports from outside, service restart, move to a new PC
        env:
          RELAY_OUTSIDE: "1"
          RELAY_MOVE: pwsh -NoProfile -File test/e2e/windows-relay-move.ps1
        run: |
          node test/e2e/windows-relay-check.js "$env:RUNNER_TEMP\relay-check.json"
          $ok = $LASTEXITCODE
          Copy-Item "$env:ProgramData\Riyeser Relay\logs\relay.log" "$env:RUNNER_TEMP\relay-service.log" -ErrorAction SilentlyContinue
          exit $ok
      - name: Uninstall
        if: always()
        run: ./src/relay/deploy/windows/install-relay.ps1 -Uninstall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-windows
          path: |
            ${{ runner.temp }}/relay-check.json
            ${{ runner.temp }}/relay-service.log
            ${{ runner.temp }}/natpmp-requests.log

  # Admin → Updates → "Update all", pressed in a REAL installed Central: an older release's Central and Accounting family
  # (Accounting Basics, Bookings, Estimate, POS) installed first, then Central's own button takes all five to the latest
  # release, Central last. The window is driven over Chromium's debugging port (scripts/central-update-all-check.js),
  # so it's the same click, the same main-process handler and the same banner the owner sees.
  update-all:
    if: inputs.job == 'update-all'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # plain: a clean PC. apps-open: the four programs are open when Update all is pressed. limited: Central runs with
        # the standard-user token (UAC on, like the owner's PC). av-delete / av-lock: the antivirus takes the downloaded
        # installer away, or holds it, the moment it's saved (what Windows Security does to a new unsigned installer).
        scenario: ${{ fromJSON(inputs.scenarios || '["plain"]') }}
    defaults:
      run:
        working-directory: desktop
    env:
      GH_TOKEN: ${{ github.token }}
      SCENARIO: ${{ matrix.scenario }}
      FROM_TAG: ${{ inputs.from_tag || 'riyeser-2026.11.28-64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install the older release (Central and the Accounting family)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\riy\old, C:\riy\out | Out-Null
          foreach ($f in "RiyeserCentral-Setup.exe", "RiyeserAccountingBasics-Setup.exe", "RiyeserBookings-Setup.exe", "RiyeserEstimate-Setup.exe", "RiyeserPOS-Setup.exe") {
            gh release download $env:FROM_TAG --repo $env:OLD_REPO --dir C:\riy\old --pattern $f --clobber
            if ($LASTEXITCODE -ne 0) { throw "Couldn't download $f from $env:FROM_TAG" }
          }
          Start-Process C:\riy\old\RiyeserCentral-Setup.exe -ArgumentList "/S" -Wait
          foreach ($f in "RiyeserAccountingBasics", "RiyeserBookings", "RiyeserEstimate", "RiyeserPOS") {
            $p = Start-Process "C:\riy\old\$f-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
            Write-Host "$f exit code" $p.ExitCode
          }
          Get-Process -Name "Riyeser*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser*" | Format-Table DisplayName, DisplayVersion -AutoSize | Out-String | Write-Host
      - name: Press Update all in the installed Central
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Central.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Riyeser Central isn't installed" }
          Write-Host "Central:" $exe.FullName $exe.VersionInfo.ProductVersion "scenario:" $env:SCENARIO
          if ($env:SCENARIO -eq "apps-open") {
            foreach ($n in "Riyeser Accounting Basics", "Riyeser Bookings", "Riyeser Estimate", "Riyeser POS") { Start-Process "$env:LOCALAPPDATA\Programs\$n\$n.exe" }
            Start-Sleep -Seconds 25
            Get-Process -Name "Riyeser*" | Format-Table Name, Id, Path -AutoSize | Out-String | Write-Host
          }
          if ($env:SCENARIO -like "av-*") {
            # the antivirus stand-in: as soon as a downloaded installer is complete, take it away (or hold it for 90 s)
            Start-Job -ArgumentList $env:SCENARIO, $env:TEMP -ScriptBlock { param($mode, $tmp)
              $seen = @{}
              for ($i = 0; $i -lt 3000; $i++) {
                Get-ChildItem $tmp -Directory -Filter "riy*-update-*" -ErrorAction SilentlyContinue | ForEach-Object { Get-ChildItem $_.FullName -Filter "*.exe" -ErrorAction SilentlyContinue } | ForEach-Object {
                  if ($seen[$_.FullName] -or $_.Name -notlike "RiyeserAccountingBasics*" -or $_.Length -lt 31000000) { return }
                  $seen[$_.FullName] = 1
                  try {
                    if ($mode -eq "av-delete") { Remove-Item $_.FullName -Force; "deleted $($_.FullName)" | Add-Content C:\riy\out\av.log }
                    else { $h = [IO.File]::Open($_.FullName, 'Open', 'Read', 'None'); "locked $($_.FullName)" | Add-Content C:\riy\out\av.log; Start-Sleep -Seconds 90; $h.Close() }
                  } catch { "couldn't $mode $($_.FullName): $($_.Exception.Message)" | Add-Content C:\riy\out\av.log }
                }
                Start-Sleep -Milliseconds 20
              }
            } | Out-Null
          }
          if ($env:SCENARIO -eq "limited") {
            $node = (Get-Command node).Source
            "@`"$($exe.FullName)`" --remote-debugging-port=9339" | Set-Content C:\riy\central-limited.cmd -Encoding ascii
            runas /trustlevel:0x20000 "C:\riy\central-limited.cmd"
            node scripts/central-update-all-check.js "--exe=$($exe.FullName)" --attach --out=C:\riy\out\update-all --minutes=30
          } else {
            node scripts/central-update-all-check.js "--exe=$($exe.FullName)" --out=C:\riy\out\update-all --minutes=30
          }
          Write-Host "check exit code" $LASTEXITCODE
          # Central's own update: it closed, its installer runs, then it opens again. Wait for Windows' list to say so.
          for ($i = 0; $i -lt 60; $i++) {
            $c = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Central*" | Select-Object -First 1
            if ($c.DisplayVersion -and $c.DisplayVersion -ne "$($exe.VersionInfo.ProductVersion)".Trim()) { break }
            Start-Sleep -Seconds 5
          }
          Start-Sleep -Seconds 15
          $global:LASTEXITCODE = 0
      - name: What's installed now, and Central's install log
        if: always()
        shell: pwsh
        run: |
          Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser*" | Format-Table DisplayName, DisplayVersion -AutoSize | Out-String | Write-Host
          Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser*" | Select-Object DisplayName, DisplayVersion | ConvertTo-Json | Set-Content C:\riy\out\installed-after.json
          $log = "$env:APPDATA\Riyeser Central\logs\install.log"
          if (Test-Path $log) { Copy-Item $log C:\riy\out\install.log; Get-Content $log | Write-Host } else { Write-Host "No install.log" }
          if (Test-Path C:\riy\out\av.log) { Get-Content C:\riy\out\av.log | Write-Host }
          if (Test-Path C:\riy\out\update-all\update-all.json) { Get-Content C:\riy\out\update-all\update-all.json | Write-Host }
          Get-Process -Name "Riyeser*" -ErrorAction SilentlyContinue | Format-Table Name, Id, Path -AutoSize | Out-String | Write-Host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-all-${{ matrix.scenario }}
          path: C:\riy\out\
          if-no-files-found: ignore
