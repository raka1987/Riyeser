name: Riyeser Desk Assistant (Windows)

# Builds the Windows installer for Riyeser Desk Assistant (with Riyeser Accounting built in),
# installs it on a clean Windows machine and checks that the accounting module starts.
on:
  push:
    branches: [module/desk-assistant]
    paths: ["desktop/**", "riyeser/**", "pyproject.toml", ".github/workflows/desk-assistant-windows.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        run: |
          npm ci
          python -m pip install --quiet pillow

      - name: Unit tests
        run: npm test

      - name: Bundle Python + Riyeser Accounting
        run: python scripts/prepare_python.py

      - name: Build installer
        run: node scripts/package-win.js assistant

      - name: Accounting module starts with the bundled Python
        shell: pwsh
        run: |
          $env:RIYESER_HOME = "$env:RUNNER_TEMP\rh"
          $py = "dist\win-unpacked\resources\python\python.exe"
          $p = Start-Process -FilePath $py -ArgumentList "-m","riyeser.desktop","--no-window","--port","8765" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/setup -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Accounting server did not start" }
          Write-Host "Accounting module OK"

      - name: Install silently and check it is registered
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\RiyeserDeskAssistant-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Desk Assistant.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installed app not found" }
          Write-Host "Installed:" $exe.FullName
          $entry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Desk Assistant*"
          if (-not $entry) { throw "Not listed in Installed apps" }
          Write-Host "Listed as:" $entry.DisplayName "by" $entry.Publisher
          if (-not (Test-Path (Join-Path $exe.DirectoryName "resources\python\python.exe"))) { throw "Bundled Python missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: RiyeserDeskAssistant-Windows
          path: desktop/dist/RiyeserDeskAssistant-Setup-*.exe
          if-no-files-found: error
