name: Riyeser Central + Desk Assistant + PDF + As Built + Link + Link Office (Windows)

# Builds the Windows installers for Riyeser Central, Riyeser Desk Assistant and Riyeser PDF,
# installs them on a clean Windows machine and checks they are registered.
on:
  push:
    branches: [module/desk-assistant]
    paths: ["desktop/**", ".github/workflows/desk-assistant-windows.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        run: |
          npm ci
          python -m pip install --quiet pillow

      - name: Unit tests
        run: npm test

      - name: Licence public key (from Riyeser's licence function; none until licence signing is switched on)
        shell: bash
        run: |
          # A public key, so it's fine in logs. 404: the function isn't deployed yet, so this build accepts unsigned
          # licences as before. Anything else that isn't a good key stops the build rather than ship without one.
          url="https://goaugynxeatzqzifpoes.supabase.co/functions/v1/licence/public-key"
          code=000
          for i in 1 2 3 4; do
            code=$(curl -sS -o "$RUNNER_TEMP/licence-key.json" -w '%{http_code}' "$url") || code=000
            if [ "$code" != 000 ] && [ "${code:0:1}" != 5 ]; then break; fi
            sleep 10
          done
          if [ "$code" = 200 ]; then
            key=$(node -e "const k=String(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).public_key||'');if(Buffer.from(k,'base64').length!==32)process.exit(1);process.stdout.write(k)" "$RUNNER_TEMP/licence-key.json") || { echo "The licence function's public key isn't a valid Ed25519 key"; exit 1; }
            echo "RIYESER_LICENCE_PUBLIC_KEY=$key" >> "$GITHUB_ENV"
            echo "Licence public key built in: $key"
          elif [ "$code" = 404 ]; then
            echo "Licence signing isn't set up yet: building without a public key (unsigned licences still work)."
          else
            echo "Couldn't fetch the licence public key (HTTP $code). Try again."; exit 1
          fi
      - name: Build installers
        run: node scripts/package-win.js

      - name: Install silently and check both apps
        shell: pwsh
        run: |
          # Riyeser Link was called Riyeser Team. Install the released Riyeser Team first, so the new build is checked
          # as an update over it: same folder and program file, one Installed apps entry, sign-in folder kept.
          # M3: the installer is RiyeserLink-Setup now, with a RiyeserTeam-Setup copy for the old name
          $lk = Get-ChildItem "dist-team\RiyeserLink-Setup-*.exe" | Select-Object -First 1
          $tm = Get-ChildItem "dist-team\RiyeserTeam-Setup-*.exe" | Select-Object -First 1
          if (-not $lk -or -not $tm -or (Get-FileHash $lk.FullName).Hash -ne (Get-FileHash $tm.FullName).Hash) { throw "Expected RiyeserLink-Setup and the same file as RiyeserTeam-Setup in dist-team" }
          $old = "$env:RUNNER_TEMP\RiyeserTeam-old.exe"
          Invoke-WebRequest "https://github.com/raka1987/Riyeser/releases/latest/download/RiyeserTeam-Setup.exe" -OutFile $old
          Start-Process -FilePath $old -ArgumentList "/S" -Wait
          $oldEntry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -like "Riyeser Team*" -or $_.DisplayName -like "Riyeser Link [0-9]*" }
          if (-not $oldEntry) { throw "The released Riyeser Team didn't install" }
          Write-Host "Released copy installed first:" $oldEntry.DisplayName
          $oldExe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Team.exe" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\Riyeser Team" | Out-Null
          Set-Content "$env:APPDATA\Riyeser Team\update-check.txt" "kept"
          foreach ($app in @(
              @{ setup = "dist\RiyeserDeskAssistant-Setup-*.exe"; exe = "Riyeser Desk Assistant.exe"; name = "Riyeser Desk Assistant*" },
              @{ setup = "dist-pdf\RiyeserPDF-Setup-*.exe"; exe = "Riyeser PDF.exe"; name = "Riyeser PDF*" },
              @{ setup = "dist-central\RiyeserCentral-Setup-*.exe"; exe = "Riyeser Central.exe"; name = "Riyeser Central*" },
              @{ setup = "dist-services\RiyeserServices-Setup-*.exe"; exe = "Riyeser Services.exe"; name = "As Built*" },
              @{ setup = "dist-team\RiyeserLink-Setup-*.exe"; exe = "Riyeser Team.exe"; name = "Riyeser Link [0-9]*" })) {
            $setup = Get-ChildItem $app.setup | Select-Object -First 1
            Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter $app.exe | Select-Object -First 1
            if (-not $exe) { throw "Installed app not found: $($app.exe)" }
            Write-Host "Installed:" $exe.FullName
            $entry = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like $app.name
            if (-not $entry) { throw "Not listed in Installed apps: $($app.name)" }
            Write-Host "Listed as:" $entry.DisplayName "by" $entry.Publisher
          }
          # The update over the released Riyeser Team: one entry (now Riyeser Link), same program file, data kept
          $teamEntries = @(Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -like "Riyeser Team*" -or $_.DisplayName -like "Riyeser Link [0-9]*" })
          if ($teamEntries.Count -ne 1 -or $teamEntries[0].DisplayName -notlike "Riyeser Link 1.1*") { throw "Expected one Installed apps entry, Riyeser Link 1.1, found: $($teamEntries.DisplayName)" }
          $newExe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Team.exe" | Select-Object -First 1).FullName
          if ($newExe -ne $oldExe) { throw "Riyeser Link moved: was $oldExe, now $newExe" }
          if ((Get-Content "$env:APPDATA\Riyeser Team\update-check.txt" -Raw).Trim() -ne "kept") { throw "The Riyeser Team data folder wasn't kept" }
          $desk = [Environment]::GetFolderPath("Desktop")
          if (-not (Test-Path "$desk\Riyeser Link.lnk")) { throw "No Riyeser Link desktop shortcut after the update" }
          if (Test-Path "$desk\Riyeser Team.lnk") { Write-Warning "The old Riyeser Team desktop shortcut is still there" }
          Write-Host "Updated in place:" $teamEntries[0].DisplayName "at" $newExe
          # Riyeser Link Office installs for the whole PC (Program Files, HKLM) and adds its Windows Firewall rule
          $lsetup = Get-ChildItem "dist-linkoffice\RiyeserLinkOffice-Setup-*.exe" | Select-Object -First 1
          Start-Process -FilePath $lsetup.FullName -ArgumentList "/S" -Wait
          $link = @("$env:ProgramFiles\Riyeser Link Office\Riyeser Link Office.exe", "$env:ProgramFiles\riyeser-linkoffice\Riyeser Link Office.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $link) { $link = (Get-ChildItem "$env:ProgramFiles" -Depth 2 -Filter "Riyeser Link Office.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          if (-not $link) { throw "Installed app not found: Riyeser Link Office.exe" }
          Write-Host "Installed:" $link
          $lentry = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -like "Riyeser Link Office*"
          if (-not $lentry) { throw "Not listed in Installed apps: Riyeser Link Office" }
          Write-Host "Listed as:" $lentry.DisplayName "by" $lentry.Publisher
          $rule = cmd /c 'netsh advfirewall firewall show rule name="Riyeser Link Office" verbose' | Out-String
          if ($LASTEXITCODE -ne 0 -or $rule -notmatch "5060" -or $rule -notmatch [regex]::Escape($link)) { throw "Riyeser Link Office's firewall rule is missing: $rule" }
          Write-Host "Firewall rule added for" $link
          $lreport = "$env:RUNNER_TEMP\link.json"
          Start-Process -FilePath $link -ArgumentList "--self-test=$lreport" -Wait
          $l = Get-Content $lreport -Raw | ConvertFrom-Json
          if (-not ($l.ok -and $l.sip -and $l.provisioning -and $l.name -eq "Riyeser Link Office")) { throw "Riyeser Link Office's self-test failed: $($l | ConvertTo-Json -Compress)" }
          Write-Host "Riyeser Link Office" $l.version "registers phones, connects a test call and sets up a desk phone"
          # Riyeser Central must find the other programs it opens
          $central = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Central.exe" | Select-Object -First 1
          $report = "$env:RUNNER_TEMP\central.json"
          Start-Process -FilePath $central.FullName -ArgumentList "--self-test=$report" -Wait
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $r.programs | Format-Table id, status, where -AutoSize | Out-String | Write-Host
          foreach ($id in @("desk", "pdf", "services", "team", "linkoffice")) { if (($r.programs | Where-Object id -eq $id).status -ne "installed") { throw "Riyeser Central can't find $id" } }
          Write-Host "Riyeser Central" $r.version "finds Desk Assistant, PDF, As Built, Riyeser Link and Riyeser Link Office"
          # As Built must carry its own copy of the app (works with no internet)
          $svc = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Services.exe" | Select-Object -First 1
          $sreport = "$env:RUNNER_TEMP\services.json"
          Start-Process -FilePath $svc.FullName -ArgumentList "--self-test=$sreport" -Wait
          $s = Get-Content $sreport -Raw | ConvertFrom-Json
          if (-not ($s.bundled -and $s.appPage -and $s.start)) { throw "As Built is missing its offline copy: $($s | ConvertTo-Json -Compress)" }
          Write-Host "As Built" $s.version "works offline (app files inside the program)"
          # Riyeser Link starts, and sets itself to start with Windows (so calls can ring); its data stays in the Riyeser Team folder
          $team = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Riyeser Team.exe" | Select-Object -First 1
          $treport = "$env:RUNNER_TEMP\team.json"
          Start-Process -FilePath $team.FullName -ArgumentList "--hidden", "--self-test=$treport" -Wait
          $t = Get-Content $treport -Raw | ConvertFrom-Json
          if (-not ($t.ok -and $t.loginItem -and $t.name -eq "Riyeser Link" -and $t.version -eq [regex]::Match((Get-Content scripts\builder.config.js -Raw), "name: 'riyeser-team', version: '([^']+)'").Groups[1].Value -and $t.url -eq "https://riyeser.com/link/")) { throw "Riyeser Link didn't start properly: $($t | ConvertTo-Json -Compress)" }
          if ($t.userData -ne "$env:APPDATA\Riyeser Team" -or $t.sessionData -ne "$env:APPDATA\Riyeser Team") { throw "Riyeser Link must keep its sign-in in the Riyeser Team folder: $($t | ConvertTo-Json -Compress)" }
          Write-Host "Riyeser Link" $t.version "starts, starts with Windows, and keeps its data in" $t.userData
          # Uninstalling Riyeser Link Office removes its firewall rule
          $un = Get-ChildItem (Split-Path $link) -Filter "Uninstall*.exe" | Select-Object -First 1
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait
          $gone = $false
          for ($i = 0; $i -lt 60 -and -not $gone; $i++) { Start-Sleep -Seconds 2; cmd /c 'netsh advfirewall firewall show rule name="Riyeser Link Office"' | Out-Null; $gone = ($LASTEXITCODE -ne 0) }
          if (-not $gone) { throw "Riyeser Link Office's firewall rule is still there after uninstalling" }
          Write-Host "Uninstalling Riyeser Link Office removed its firewall rule"
          $global:LASTEXITCODE = 0
          $leftover = Get-ChildItem "$env:LOCALAPPDATA\Programs\desk-assistant\resources" -Directory | Where-Object Name -in @("python", "accounting")
          if ($leftover) { throw "Accounting files are still bundled" }

      - uses: actions/upload-artifact@v4
        with:
          name: Riyeser-Windows-installers
          path: |
            desktop/dist/RiyeserDeskAssistant-Setup-*.exe
            desktop/dist-pdf/RiyeserPDF-Setup-*.exe
            desktop/dist-central/RiyeserCentral-Setup-*.exe
            desktop/dist-services/RiyeserServices-Setup-*.exe
            desktop/dist-team/RiyeserLink-Setup-*.exe
            desktop/dist-linkoffice/RiyeserLinkOffice-Setup-*.exe
          if-no-files-found: error
