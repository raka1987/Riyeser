name: Deploy online connections API

# The "api" Edge Function (supabase/functions/api): Riyeser's public API for websites and online shops (bookings,
# orders, enquiries, customers, quote acceptances, invoice payments in; catalogue, prices, stock and free booking
# times out; signed webhooks). The contract is docs/api/openapi.yaml. Runs only when started by hand
# (Actions -> Deploy online connections API -> Run workflow), so a change to the code never goes live by itself.
#
# Before the first run: paste the latest website/team/team-chat.sql (branch module/desk-assistant) into Supabase's
# SQL Editor, so the api_* functions are there. The function finds the database with the SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY that Supabase gives every function; no API keys are ever stored here.
#
# GitHub secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  a Supabase personal access token (the same one the licence and paypal functions use)
#   API_CRON_SECRET        optional: a long random text the webhook job (api-webhooks.yml) uses instead of the
#                          service role key. Goes straight to the function's secrets through a pipe.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: deploy-api-function, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: goaugynxeatzqzifpoes   # public (it's in riyeser.com/link/config.js)
    steps:
      - name: Is it set up?
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Not set up yet: add the GitHub secret SUPABASE_ACCESS_TOKEN, then run this again."
            echo "Not set up yet: add the GitHub secret **SUPABASE_ACCESS_TOKEN**, then run this again." >> "$GITHUB_STEP_SUMMARY"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'yes'
      - uses: denoland/setup-deno@v2
        if: steps.ready.outputs.go == 'yes'
        with: { deno-version: v2.x }
      - name: Test the API code (a pretend database)
        if: steps.ready.outputs.go == 'yes'
        run: deno test supabase/functions/api
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.go == 'yes'
        with: { version: latest }
      - name: Webhook job secret (optional, from GitHub secrets straight to the function's secrets)
        if: steps.ready.outputs.go == 'yes'
        env:
          API_CRON_SECRET: ${{ secrets.API_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "${API_CRON_SECRET:-}" ]; then
            if [ "${#API_CRON_SECRET}" -lt 32 ]; then echo "API_CRON_SECRET must be at least 32 characters."; exit 1; fi
            printf 'API_CRON_SECRET=%s\n' "$(printf '%s' "$API_CRON_SECRET" | tr -d '\r\n')" \
              | supabase secrets set --yes --env-file /dev/stdin --project-ref "$PROJECT_REF" > /dev/null
            echo "Saved API_CRON_SECRET as a function secret."
          else
            echo "No API_CRON_SECRET: the webhook job uses the service role key instead."
          fi
      - name: Deploy the api function
        if: steps.ready.outputs.go == 'yes'
        # --no-verify-jwt: websites call it with Riyeser API keys (rk_…), not Supabase sign-ins; it checks them itself
        run: supabase functions deploy api --yes --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Check it answers
        if: steps.ready.outputs.go == 'yes'
        run: |
          set -euo pipefail
          url="https://$PROJECT_REF.supabase.co/functions/v1/api/v1/ping"
          for i in $(seq 1 12); do
            if curl -sf "$url" -o "$RUNNER_TEMP/ping.json"; then break; fi
            sleep 5
          done
          node -e "const p=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!p.ok)process.exit(1);console.log('API answers: version '+p.version)" "$RUNNER_TEMP/ping.json"
          {
            echo "### The online connections API is live"
            echo
            echo "Base address: \`https://$PROJECT_REF.supabase.co/functions/v1/api/v1\`"
            echo
            echo "Webhooks are sent by **API webhooks** (api-webhooks.yml) every 5 minutes, and straight away for what websites send."
          } >> "$GITHUB_STEP_SUMMARY"
