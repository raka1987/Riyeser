<style>
.ol-sync{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ol-sync .dot{width:10px;height:10px;border-radius:50%;background:#9aa4b2;flex:none}
.ol-sync .dot.ok{background:#16a34a}.ol-sync .dot.err{background:#dc2626}.ol-sync .dot.idle{background:#d97706}
.ol-sync b{font-size:15px}.ol-sync .fix{flex-basis:100%;margin:0}
.ol-test{background:#fef9c3;color:#713f12;border:1px dashed #facc15;padding:8px 12px;border-radius:8px;margin-bottom:12px}
.badge.ol-done{background:var(--ok-bg);color:var(--ok)}.badge.ol-rejected{background:var(--err-bg);color:var(--err)}
.badge.ol-failed{background:#fff4e5;color:var(--warn)}.badge.ol-test{background:#fef9c3;color:#713f12}
.ol-tabs{overflow-x:auto;flex-wrap:nowrap!important}.ol-tabs a{white-space:nowrap}
.ol-tabs .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#eef1f4;font-size:11px;text-align:center;margin-left:4px}
.ol-why{font-size:12.5px;color:var(--muted);margin-top:2px}
.ol-pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#f6f7f9;border-radius:8px;padding:10px;max-height:380px;overflow:auto}
.ol-kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px}.ol-kv dt{color:var(--muted)}.ol-kv dd{margin:0;word-break:break-word}
.ol-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ol-day{border:1px solid var(--line);border-radius:8px;padding:8px}.ol-day label{font-weight:600;display:flex;gap:6px;align-items:center}
.ol-day input[type=time]{width:100%;margin-top:4px}
.ol-pick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px}
.ol-pick label{display:flex;gap:8px;align-items:center;padding:3px 0;font-weight:400}
.ol-opts label.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-weight:400}
.ol-opts label.opt small{display:block;color:var(--muted)}
.ol-stats{display:flex;gap:18px;flex-wrap:wrap}.ol-stats div b{display:block;font-size:20px}
.ol-show-sm{display:none}
@media (max-width:700px){.ol-show-sm{display:block}#ol-list td{padding-left:8px;padding-right:8px}.ol-kv{grid-template-columns:1fr}.ol-kv dt{margin-top:6px}.ol-hide-sm{display:none}}
.ol-opts label.opt input,.ol-pick input,.ol-day label input,#ol-settings label>input[type=checkbox]{width:auto!important;flex:none;margin:3px 0 0;padding:0;min-height:0}
.ol-opts label.opt>span{flex:1;text-align:left}.ol-opts label.opt b{display:block}
</style>
