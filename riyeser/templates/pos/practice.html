<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice terminal</title>
<style>
:root{--g:#16a34a;--r:#dc2626}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#1e293b,#0f172a);color:#e2e8f0;font:16px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.dev{width:min(380px,100%);background:#0b1220;border:2px solid #334155;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}h1 span{font-size:11px;background:#facc15;color:#422006;border-radius:6px;padding:2px 7px}
.scr{background:#d1fae5;color:#064e3b;border-radius:14px;padding:16px;text-align:center;font-weight:800;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.scr b{font-size:34px;font-variant-numeric:tabular-nums}.scr small{font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;color:#94a3b8;font-weight:700;display:flex;flex-direction:column;gap:3px;min-width:0}
select,input{border:0;border-radius:10px;padding:9px;font:inherit;min-height:44px;width:100%;min-width:0}
button{border:0;border-radius:12px;min-height:54px;font:inherit;font-weight:800;color:#fff;cursor:pointer}
.ap{background:var(--g)}.dc{background:var(--r)}.cn{background:#f59e0b;color:#2a1800}.to{background:#475569}
button:disabled{opacity:.35;cursor:not-allowed}
p{margin:0;font-size:13px;color:#94a3b8}a{color:#93c5fd}
</style></head><body>
<div class="dev">
  <h1>Practice terminal <span>NO MONEY MOVES</span></h1>
  <label>This machine belongs to<select id="till">{% for t in tills %}<option value="{{ t.id }}" {{ 'selected' if t.id == till }}>{{ t.name }}</option>{% endfor %}</select></label>
  <div class="scr" id="scr"><small>Riyeser practice</small><b>Ready</b><small>Waiting for the till</small></div>
  <div class="g2"><label>Card<select id="sch">{% for s in schemes %}<option>{{ s }}</option>{% endfor %}</select></label>
    <label>How<select id="ent"><option value="tap">Tap</option><option value="insert">Insert</option><option value="swipe">Swipe</option><option value="wallet">Phone</option></select></label></div>
  <button class="ap" data-a="approve">Approve</button>
  <div class="g2"><label>Tip<input id="tip" inputmode="decimal" value="2.00"></label><label>Cash out<input id="co" inputmode="decimal" value="20.00"></label></div>
  <div class="g2"><button class="ap" data-a="tip">Approve + tip</button><button class="ap" data-a="cashout">Approve + cash out</button></div>
  <div class="g2"><button class="dc" data-a="decline">Decline</button><button class="cn" data-a="cancel">Cancel</button></div>
  <button class="to" data-a="timeout">Time out</button>
  <p>Open this page on a second tablet or window to act as the customer's card machine. <a href="{{ url_for('pos.register') }}">Back to the till</a></p>
</div>
<script>
(function(){const $=s=>document.querySelector(s),BASE='{{ url_for('pos.register') }}',m={{ money_js() }};
let txn=null;
async function poll(){try{const d=await (await fetch(BASE+'terminal/practice?poll=1&till='+$('#till').value)).json();txn=d.txn;}catch(e){}
  $('#scr').innerHTML=txn?`<small>${txn.kind==='refund'?'REFUND':'PURCHASE'}</small><b>${m(txn.amount)}</b><small>Present card</small>`:'<small>Riyeser practice</small><b>Ready</b><small>Waiting for the till</small>';
  document.querySelectorAll('button[data-a]').forEach(b=>b.disabled=!txn);setTimeout(poll,1000);}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b||!txn)return;const a=b.dataset.a;
  await fetch(BASE+'terminal/'+txn.id+'/practice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:['tip','cashout'].includes(a)?'approve':a,
    tip:a==='tip'?$('#tip').value:'0',cashout:a==='cashout'?$('#co').value:'0',scheme:$('#sch').value,entry:$('#ent').value})});txn=null;});
poll();})();
</script></body></html>
