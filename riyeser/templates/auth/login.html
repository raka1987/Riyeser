{% from "_macros.html" import flashes %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Riyeser Accounting</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><div class="login">
<div class="brand" style="color:var(--ink);padding:0 0 18px"><div class="logo" style="color:#fff">R</div><div>Riyeser Group · Accounting<small>{{ company.name if company }}</small></div></div>
{{ flashes() }}
<form method="post">
  {% if choices and choices|length > 1 %}<label>Company</label><select name="company" style="margin-bottom:12px">{% for c in choices %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>{% endif %}
  <label>Username</label><input name="username" autofocus required>
  <label style="margin-top:12px">Password</label><input name="password" type="password" required>
  <button class="btn pri" style="margin-top:18px;width:100%;justify-content:center">Sign in</button>
</form>
<p style="text-align:center;margin:16px 0 0"><a href="{{ url_for('auth.forgot') }}">Forgot password?</a></p></div></body></html>
