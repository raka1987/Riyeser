[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riyeser-accounting"
version = "1.1.0"
authors = [{name = "Riyeser Group"}]
description = "Riyeser Accounting (a Riyeser Group module) - double-entry business accounting (sales, purchases, banking, inventory, payroll, GST/BAS, reports)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "waitress>=3.0", "pywebview>=5", "fpdf2>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]

[project.gui-scripts]
riyeser-accounting = "riyeser.desktop:main"

[project.scripts]
riyeser = "riyeser.cli:main"

[tool.setuptools]
packages = ["riyeser", "riyeser.views"]
include-package-data = true

[tool.setuptools.package-data]
riyeser = ["schema.sql", "static/*", "templates/*.html", "templates/*/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
