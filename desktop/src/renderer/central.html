<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Riyser Central</title>
  <link rel="stylesheet" href="central.css">
</head>
<body>
  <div class="wrap">
    <header class="head">
      <img src="icon-central.png" alt="">
      <div class="brand"><b>Riyser Central</b><small>Riyser Group</small></div>
      <button id="theme" class="themebtn" title="Light or dark">☾</button>
      <div class="clock"><span id="time">--:--</span><small id="date"></small></div>
    </header>
    <div class="search glass"><span>🔍</span><input id="q" placeholder="Search all your files — name, words inside, company or an old name" autocomplete="off"><button id="qclear" class="clear" hidden>✕</button></div>
    <section id="results" hidden></section>
    <section id="home">
      <div id="updates" class="glass upd" hidden></div>
      <div class="tiles" id="tiles"></div>
      <div class="widgets">
        <div class="glass w"><h3>💲 Money</h3><div id="money"><span class="lbl">Loading…</span></div></div>
        <div class="glass w"><h3>📅 Today</h3><div id="today"><span class="lbl">Loading…</span></div></div>
        <div class="glass w"><h3>✅ To-do</h3><div id="todo"><span class="lbl">Loading…</span></div></div>
      </div>
      <h4 class="dockh">Recent documents</h4>
      <div class="dock" id="recent"></div>
    </section>
    <p class="foot"><span id="foot"></span> · <button class="link" id="checkupd">Check for updates</button></p>
  </div>
  <div id="toast" class="toast"></div>
  <script src="central.js"></script>
</body>
</html>
