<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Riyeser Central</title>
  <link rel="stylesheet" href="central.css">
</head>
<body>
  <div id="demobar" class="demobar" role="status" hidden></div>
  <div class="app">
    <aside class="side">
      <div class="logo"><img src="logo-r.png" alt=""><b>Riyeser Central</b></div>
      <nav class="nav" id="nav"></nav>
      <div class="foot"><div id="acct" class="acct"></div><span id="foot"></span><br><button id="licbtn">Licence</button> · <button id="checkupd">Check for updates</button> · <button id="setbtn">Settings</button></div>
    </aside>
    <main class="main">
      <div class="inner">
        <header class="top">
          <div class="greet"><h1 id="hello">Hello.</h1><div class="date">Your business at a glance in Riyeser Central. <span id="date"></span></div></div>
          <label class="search"><span data-ic="search"></span><input id="q" placeholder="Search all your files: name, words inside, company" autocomplete="off"><button id="qclear" class="clear" hidden aria-label="Clear" data-ic="x"></button></label>
          <button id="theme" class="iconbtn" title="Light or dark"></button>
        </header>
        <div id="updates" class="panel banner" hidden></div>
        <div id="licbar" class="panel banner" hidden></div>
        <div id="cobar" class="panel banner" hidden></div>
        <div id="demonote" class="panel banner" hidden></div>

        <section id="results" hidden></section>

        <section id="home">
          <div id="checklist" class="panel cl" hidden></div>
          <div class="cards" id="cards"></div>
          <div class="cols">
            <div class="stack">
              <div class="panel" id="actp">
                <div class="ph"><span class="grow">Recent activity</span><button class="lnk" id="actall">View all <span class="chev">›</span></button></div>
                <div id="activity"></div>
              </div>
              <div class="panel" id="moneyp">
                <div class="ph"><span class="grow">Invoices to chase</span><button class="lnk" data-open="" id="moneyopen">Open Accounting <span class="chev">›</span></button></div>
                <div id="money"></div>
              </div>
            </div>
            <div class="stack">
              <div class="panel" id="onlinep" hidden><div class="ph"><span class="grow">Online connections</span><button class="lnk" id="onlinenow">Sync now <span class="chev">›</span></button></div><div id="online"></div></div>
              <div class="panel" id="quickp"><div class="ph"><span class="grow">Shortcuts</span></div><div class="quick" id="quick"></div></div>
              <div class="panel" id="todayp"><div class="ph"><span class="grow">Today</span></div><div id="today"></div></div>
              <div class="panel" id="todop"><div class="ph"><span class="grow">To-do</span><button class="lnk" data-open="desk">Open Desk Assistant <span class="chev">›</span></button></div><div id="todo"></div></div>
            </div>
          </div>
          <div id="getstarted" class="panel" hidden></div>
        </section>

        <section id="companyv" hidden></section>

        <section id="appsv" hidden>
          <div id="planbar" class="panel banner" hidden></div>
          <h2 class="sec">More Riyeser apps</h2>
          <div class="apps" id="apps"></div>
        </section>
      </div>
    </main>
  </div>
  <dialog id="licdlg" class="licdlg">
    <form method="dialog" class="lichead"><b>Your Riyeser licence</b><button class="x" value="close" aria-label="Close">✕</button></form>
    <div id="licbody"></div>
  </dialog>
  <dialog id="setdlg" class="licdlg">
    <form method="dialog" class="lichead"><b>Settings</b><button class="x" value="close" aria-label="Close">✕</button></form>
    <div class="setbody"><label class="setrow"><input type="checkbox" id="sethide"><span><b>Show “Getting started” on the home screen</b><small>The checklist that helps you set up Riyeser. It ticks itself as you go.</small></span></label></div>
  </dialog>
  <div id="wizard" class="wiz" hidden></div>
  <div id="toast" class="toast"></div>
  <script src="demo-ui.js"></script>
  <script src="licence-ui.js"></script>
  <script src="central.js"></script>
  <script src="company.js"></script>
  <script src="online-sync-ui.js"></script>
</body>
</html>
