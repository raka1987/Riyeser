<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' data: blob:">
  <title>PDF Editor</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body data-view="home">
  <header class="topbar">
    <div class="tabbar" id="tabbar">
      <div class="tablist" role="tablist" aria-label="Open PDFs">
        <button id="hometab" class="tab home active" role="tab" aria-selected="true" data-cmd="home" title="Start: everyday jobs and recent files"><span aria-hidden="true">⌂</span> Start</button>
        <div id="tabstrip" class="tabstrip"></div>
      </div>
      <button class="tabnew" data-cmd="open" title="Open a PDF (Ctrl+O)" aria-label="Open a PDF">＋</button>
      <span class="spacer"></span>
      <button class="tabbtn" data-cmd="settings" title="Settings: my details, signatures, dates on stamps, Windows" aria-label="Settings"><span aria-hidden="true">⚙</span> <span class="tbl">Settings</span></button>
    </div>
    <div class="docbars">
      <div class="row filebar">
        <button data-cmd="open" title="Open a PDF (Ctrl+O)">Open</button>
        <button class="primary" data-cmd="save" title="Save (Ctrl+S)">Save</button>
        <button data-cmd="saveas" title="Save a copy with a new name (Ctrl+Shift+S)">Save as…</button>
        <button data-cmd="protect" title="Protect the saved PDF with a password"><span aria-hidden="true">🔒</span> Password…</button>
        <button data-cmd="senddocs" title="Put a copy in the Riyeser Documents library's Inbox"><span aria-hidden="true">📤</span> <span class="sdl">Send to Documents</span></button>
        <span class="sep"></span>
        <button data-cmd="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
        <button data-cmd="redo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
        <span class="sep"></span>
        <button data-cmd="zoomout" title="Zoom out" aria-label="Zoom out">−</button>
        <span id="zoomlabel" class="muted small zoomlabel">100%</span>
        <button data-cmd="zoomin" title="Zoom in" aria-label="Zoom in">+</button>
        <button data-cmd="fitwidth" title="Fit the page to the window">Fit</button>
        <span class="sep"></span>
        <span id="pageinfo" class="muted small"></span>
        <span class="spacer"></span>
        <span class="stylebox" role="group" aria-label="Colour and text style for what you add">
          <label title="Colour"><input type="color" id="color" value="#1d4ed8" aria-label="Colour"></label>
          <select id="fontsize" title="Text size" aria-label="Text size"><option>8</option><option>10</option><option selected>12</option><option>14</option><option>18</option><option>24</option><option>36</option></select>
          <select id="font" title="Font" aria-label="Font"><option value="Helvetica">Sans</option><option value="TimesRoman">Serif</option><option value="Courier">Mono</option></select>
          <button id="boldbtn" title="Bold" aria-label="Bold"><b>B</b></button>
        </span>
      </div>
      <div class="row tools" id="tools">
        <button data-tool="select" class="active" title="Select / move (V)" aria-pressed="true"><span class="ic" aria-hidden="true">↖</span><span class="lbl">Select</span></button>
        <button data-tool="text" title="Add text (T)" aria-label="Add text"><span class="ic" aria-hidden="true">T</span><span class="lbl">Add text</span></button>
        <button data-tool="edittext" title="Click existing text to change it (E)" aria-label="Edit text"><span class="ic" aria-hidden="true">✎</span><span class="lbl">Edit text</span></button>
        <button data-tool="highlight" title="Highlight (H)" aria-label="Highlight"><span class="ic" aria-hidden="true">▮</span><span class="lbl">Highlight</span></button>
        <button data-tool="draw" title="Pen (P)" aria-label="Draw"><span class="ic" aria-hidden="true">✐</span><span class="lbl">Draw</span></button>
        <button data-tool="check" title="Tick" aria-label="Tick"><span class="ic" aria-hidden="true">✓</span><span class="lbl">Tick</span></button>
        <button data-tool="cross" title="Cross" aria-label="Cross"><span class="ic" aria-hidden="true">✗</span><span class="lbl">Cross</span></button>
        <div class="menuwrap"><button id="shapesbtn" data-cmd="shapesmenu" aria-haspopup="true" aria-expanded="false" title="Boxes, circles, lines, arrows, underline, strike, white-out and redact"><span class="ic" aria-hidden="true">◇</span><span class="lbl">Shapes</span> ▾</button>
          <div class="menu" id="shapesmenu" role="menu" hidden>
            <button role="menuitem" data-tool="rect"><span class="ic" aria-hidden="true">▭</span>Box</button>
            <button role="menuitem" data-tool="ellipse"><span class="ic" aria-hidden="true">◯</span>Circle</button>
            <button role="menuitem" data-tool="line"><span class="ic" aria-hidden="true">╱</span>Line</button>
            <button role="menuitem" data-tool="arrow"><span class="ic" aria-hidden="true">➚</span>Arrow</button>
            <button role="menuitem" data-tool="underline"><span class="ic" aria-hidden="true">U̲</span>Underline</button>
            <button role="menuitem" data-tool="strike"><span class="ic" aria-hidden="true">S̶</span>Strike through</button>
            <div class="msep"></div>
            <button role="menuitem" data-tool="whiteout" title="Covers things up (the original stays in the file underneath)"><span class="ic" aria-hidden="true">◻</span>White-out</button>
            <button role="menuitem" data-tool="redact" title="Blacks out and permanently REMOVES what's underneath when you save"><span class="ic" aria-hidden="true">■</span>Redact (removes it for good)</button>
          </div></div>
        <span class="sep"></span>
        <div class="menuwrap"><button id="signbtn" data-cmd="signmenu" aria-haspopup="true" aria-expanded="false" title="Your signature and initials"><span class="ic" aria-hidden="true">✍</span><span class="lbl">Sign</span> ▾</button>
          <div class="menu" id="signmenu" role="menu" hidden>
            <button role="menuitem" data-cmd="mysignature"><span class="ic" aria-hidden="true">✍</span>My signature<small>One click: drag it into place</small></button>
            <button role="menuitem" data-cmd="myinitials"><span class="ic" aria-hidden="true">Ⓘ</span>My initials</button>
            <div class="msep"></div>
            <button role="menuitem" data-cmd="signature"><span class="ic" aria-hidden="true">✎</span>New or saved signatures…</button>
            <button role="menuitem" data-cmd="initialsnew"><span class="ic" aria-hidden="true">✎</span>New or saved initials…</button>
            <!-- HOOK (sign-request): shown only when src/renderer/sign-request.js is installed (feat/pdf-sign-request) -->
            <div class="msep" id="signrequestsep" hidden></div>
            <button role="menuitem" data-cmd="signrequest" hidden><span class="ic" aria-hidden="true">✉</span>Ask someone to sign…<small>Send it to people to sign online</small></button>
            <button role="menuitem" data-cmd="signstatus" hidden><span class="ic" aria-hidden="true">📋</span>Sent for signing</button>
          </div></div>
        <div class="menuwrap"><button data-cmd="stamp" id="stampbtn" aria-haspopup="true" aria-expanded="false" title="Stamps: Paid, Received, Approved… with today's date"><span class="ic" aria-hidden="true">🔖</span><span class="lbl">Stamp</span> ▾</button>
          <div class="menu" id="stampmenu" role="menu" hidden></div></div>
        <button data-cmd="date" title="Today's date"><span class="ic" aria-hidden="true">📅</span><span class="lbl">Date</span></button>
        <button data-cmd="image" title="Add a picture"><span class="ic" aria-hidden="true">🖼</span><span class="lbl">Image</span></button>
        <button data-cmd="ocr" title="Read the text in a scanned PDF so you can search, copy and edit it"><span class="ic" aria-hidden="true">🔍</span><span class="lbl">Recognise text</span></button>
        <div class="menuwrap"><button data-cmd="toolsmenu" id="toolsbtn" aria-haspopup="true" aria-expanded="false" title="More tools"><span class="ic" aria-hidden="true">🧰</span><span class="lbl">Tools</span> ▾</button>
          <div class="menu" id="toolsmenu" role="menu" hidden>
            <div class="mh">View</div>
            <button role="menuitem" data-cmd="basicview">👁 Open in basic viewer (if a page shows blank)</button>
            <div class="mh">Convert</div>
            <button role="menuitem" data-cmd="convertpage">🔄 Convert to Word, Excel, text or pictures…</button>
            <button role="menuitem" data-cmd="toword">📝 Convert to Word (basic: layout may change)</button>
            <button role="menuitem" data-cmd="exportimages">🖼 Save pages as pictures…</button>
            <button role="menuitem" data-cmd="createpdf">📄 Create PDF from pictures, Word, Excel…</button>
            <div class="mh">Pages</div>
            <button role="menuitem" data-cmd="blankpage">➕ Insert blank page after this one</button>
            <button role="menuitem" data-cmd="split">✂ Split into separate files…</button>
            <button role="menuitem" data-cmd="pagenumbers">#️⃣ Page numbers…</button>
            <div class="mh">Mark</div>
            <button role="menuitem" data-cmd="watermark">💧 Watermark…</button>
            <div class="mh">File</div>
            <button role="menuitem" data-cmd="compress">🗜 Compress PDF…</button>
            <button role="menuitem" data-cmd="compare">⇆ Compare with another PDF…</button>
            <button role="menuitem" data-cmd="senddocs">📤 Send to Riyeser Documents…</button>
            <button role="menuitem" data-cmd="pdfbackups">📂 Copies kept when saving over a file</button>
            <div class="mh">Help</div>
            <button role="menuitem" data-cmd="help">❓ Help with Riyeser PDF</button>
          </div></div>
      </div>
    </div>
  </header>
  <div class="layout" id="docview">
    <aside class="side">
      <div class="tabs" role="tablist" aria-label="Side panel">
        <button data-panel="pages" class="active" role="tab" aria-selected="true">Pages</button>
        <button data-panel="find" role="tab" aria-selected="false">Find</button>
        <button data-panel="forms" role="tab" aria-selected="false">Form <span id="formcount"></span></button>
      </div>
      <div id="panel-pages" class="panel">
        <div class="row small pageops">
          <button data-cmd="rotl" title="Rotate left" aria-label="Rotate left">⟲</button>
          <button data-cmd="rotr" title="Rotate right" aria-label="Rotate right">⟳</button>
          <button data-cmd="up" title="Move page up" aria-label="Move page up">▲</button>
          <button data-cmd="down" title="Move page down" aria-label="Move page down">▼</button>
          <button data-cmd="delpage" title="Delete page" aria-label="Delete page">🗑</button>
        </div>
        <div class="row small pageops">
          <button data-cmd="insert" title="Insert pages from another PDF after this page">+ Insert PDF</button>
          <button data-cmd="extract" title="Save the selected pages as a new PDF">Extract</button>
        </div>
        <p class="muted small" style="margin:6px 0">Ctrl+click to select several pages.</p>
        <div id="thumbs"></div>
      </div>
      <div id="panel-find" class="panel" hidden>
        <input id="findq" placeholder="Search this PDF…" aria-label="Search this PDF" style="width:100%">
        <div id="findres" class="small"></div>
      </div>
      <div id="panel-forms" class="panel" hidden>
        <div id="formfields" class="small"></div>
      </div>
    </aside>
    <main id="viewer"><div id="scanbanner" class="scanbanner" hidden></div><div id="pages"></div></main>
  </div>

  <section id="home" class="home" aria-label="Start"></section>
  <section id="task" class="taskpage" aria-live="polite"></section>
  <div class="dropzone" aria-hidden="true"><div>Drop PDFs to open them, or pictures to make a PDF</div></div>

  <div id="sigmodal" class="modal" hidden>
    <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="sigtitle">
      <div class="row"><h2 id="sigtitle" style="margin:0">Your signature</h2>
        <div class="seg" role="group" aria-label="Signature or initials"><button data-sigkind="signature" class="active" aria-pressed="true">Signature</button><button data-sigkind="initials" aria-pressed="false">Initials</button></div>
        <span class="spacer"></span><button data-cmd="sigclose" aria-label="Close">✕</button></div>
      <div id="sigsaved" class="sigsaved"></div>
      <div class="tabs" role="tablist" style="margin-top:10px"><button data-sigtab="draw" class="active" role="tab" aria-selected="true">Draw</button><button data-sigtab="type" role="tab" aria-selected="false">Type</button><button data-sigtab="upload" role="tab" aria-selected="false">Upload a picture</button></div>
      <div data-sigpane="draw"><canvas id="sigpad" width="900" height="260" aria-label="Draw here"></canvas><div class="row"><button data-cmd="sigclear">Clear</button><span class="muted small">Sign with your mouse, trackpad or touch screen.</span></div></div>
      <div data-sigpane="type" hidden><input id="sigtext" placeholder="Type your name" aria-label="Your name" style="width:100%;font-size:18px"><canvas id="sigtyped" width="900" height="200"></canvas>
        <div class="row small"><label for="sigfont">Style</label> <select id="sigfont"><option value="'Segoe Script','Brush Script MT','Lucida Handwriting',cursive">Script</option><option value="'Lucida Handwriting','Segoe Print','Bradley Hand',cursive">Handwriting</option><option value="Georgia,serif">Formal</option></select></div></div>
      <div data-sigpane="upload" hidden><button data-cmd="sigupload">Choose a picture…</button><p class="muted small">A photo or scan of your signature on white paper works best.</p><img id="sigimg" alt="" style="max-width:100%;max-height:200px"></div>
      <div class="row" style="margin-top:12px"><label class="small"><input type="checkbox" id="sigremember" checked> Remember it for one-click placing</label><span id="sigprivacy" class="small muted"></span><span class="spacer"></span><button class="primary" data-cmd="sigplace">Place it</button></div>
    </div>
  </div>
  <div id="dlg" class="modal" hidden><div class="modalbox" id="dlgbox" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="vendor/regenerator-runtime.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/fontkit.umd.min.js"></script>
  <script type="module" src="editor.js"></script>
</body>
</html>
