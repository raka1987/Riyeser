<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Desk Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav id="nav">
      <div class="brand"><img src="icon.png" alt=""> <span class="grow">Desk Assistant</span><button id="themetoggle" class="themetoggle" title="Light / dark mode">◐</button></div>
      <a href="#today" data-page="today">Today</a>
      <a href="#organise" data-page="organise">Organise files <span id="badge-organise" class="pill" hidden></span></a>
      <a href="#desktop" data-page="desktop">Tidy Desktop</a>
      <a href="#cleanup" data-page="cleanup">Clean up Downloads</a>
      <a href="#search" data-page="search">Search</a>
      <a href="#pdf" data-page="pdf">PDF editor</a>
      <a href="#meetings" data-page="meetings">Meetings</a>
      <a href="#tasks" data-page="tasks">To-do <span id="badge-tasks" class="pill" hidden></span></a>
      <a href="#email" data-page="email">Email</a>
      <a href="#companies" data-page="companies">Companies</a>
      <a href="#settings" data-page="settings">Settings</a>
      <div class="ftree-head"><span>Folders</span><button class="link small" id="ftree-refresh" title="Refresh">⟳</button></div>
      <div id="ftree" class="ftree"></div>
      <div class="hint"><span id="appversion"></span><br>Quick search anywhere:<br><kbd id="hotkey">Ctrl</kbd> <kbd>Shift</kbd> <kbd>Space</kbd></div>
    </nav>
    <div id="navresize" class="navresize" title="Drag to resize"></div>
    <main id="page"></main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
